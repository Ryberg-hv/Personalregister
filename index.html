/* =========================================================================
   DATUM OCH VECKOR (ISO 8601 — veckan skrivs med tre siffror, t.ex. 641)
   ========================================================================= */
const MONTHS_SV = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const WD_SV = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
function pad2(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseDate(s){ const a = String(s||'').split('-').map(Number); return new Date(a[0], (a[1]||1)-1, a[2]||1); }
function addDays(d, n){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
function todayIso(){ return isoDate(new Date()); }
function startOfWeek(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  const week = Math.ceil(((t - Date.UTC(y,0,1)) / 86400000 + 1) / 7);
  return {year:y, week};
}
/* militärt veckoformat: sista siffran i ISO-veckoåret + veckonummer, 641 */
function weekCode(d){ const w = isoWeek(d); return String(((w.year%10)+10)%10) + pad2(w.week); }
function fmtDateSv(s){ const d = parseDate(s); return d.getDate()+' '+MONTHS_SV[d.getMonth()].slice(0,3)+' '+d.getFullYear(); }
function fmtDateShort(s){ const d = parseDate(s); return d.getDate()+' '+MONTHS_SV[d.getMonth()].slice(0,3); }
function timeToMin(t){ if(!t) return null; const a = t.split(':').map(Number); return a[0]*60+(a[1]||0); }
function excerpt(s, n){ s = String(s||'').replace(/\s+/g,' ').trim(); n = n||60; return s.length>n ? s.slice(0,n-1)+'…' : s; }

/* =========================================================================
   KALENDER
   ========================================================================= */
const CAL_CATS = [
  {key:'ovning',            label:'Övning',            color:'#4E6B2F'},
  {key:'insats',            label:'Insats',            color:'#A23B2C'},
  {key:'mote',              label:'Möte',              color:'#1F5FBF'},
  {key:'utvecklingssamtal', label:'Utvecklingssamtal', color:'#7A5C99'},
  {key:'event',             label:'Event',             color:'#C27A12'},
  {key:'ovrigt',            label:'Övrigt',            color:'#5F6468'},
];
function catOf(k){ return CAL_CATS.find(c=>c.key===k) || CAL_CATS[CAL_CATS.length-1]; }
function ensureKalAnslag(d){
  if(!d.kalender || typeof d.kalender!=='object') d.kalender = {};
  if(!Array.isArray(d.kalender.events)) d.kalender.events = [];
  if(!d.kalender.ack || typeof d.kalender.ack!=='object') d.kalender.ack = {};
  if(!Array.isArray(d.kalender.deleted)) d.kalender.deleted = [];
  d.kalender.events.forEach(ev=>{ if(!CAL_CATS.some(c=>c.key===ev.category)) ev.category = 'ovrigt'; if(!Array.isArray(ev.reminders)) ev.reminders = []; if(!Array.isArray(ev.removedRemIds)) ev.removedRemIds = []; });
  if(!d.anslag || typeof d.anslag!=='object') d.anslag = {};
  if(!Array.isArray(d.anslag.notes)) d.anslag.notes = [];
  if(!Array.isArray(d.anslag.deleted)) d.anslag.deleted = [];
  if(!d.anslag.gallringSnooze) d.anslag.gallringSnooze = 0;
}
function calEvents(){ return (DATA && DATA.kalender) ? DATA.kalender.events : []; }
function evEnd(ev){ return ev.end && ev.end>=ev.start ? ev.end : ev.start; }
function isTimed(ev){ return !ev.allDay && !!ev.startTime && evEnd(ev)===ev.start; }
function evSort(a, b){
  const ta = isTimed(a) ? timeToMin(a.startTime) : -1, tb = isTimed(b) ? timeToMin(b.startTime) : -1;
  return (a.start<b.start?-1:a.start>b.start?1:0) || ta-tb || String(a.title).localeCompare(String(b.title),'sv');
}
/* datum -> händelser, för ett intervall */
function buildEventIndex(fromDs, toDs){
  const idx = new Map();
  calEvents().forEach(ev=>{
    const s = ev.start>fromDs ? ev.start : fromDs;
    const e = evEnd(ev)<toDs ? evEnd(ev) : toDs;
    if(s>e) return;
    let d = parseDate(s), guard = 0;
    while(isoDate(d)<=e && guard<400){
      const k = isoDate(d);
      if(!idx.has(k)) idx.set(k, []);
      idx.get(k).push(ev);
      d = addDays(d,1); guard++;
    }
  });
  idx.forEach(list=>list.sort(evSort));
  return idx;
}

/* ---------- påminnelser ---------- */
function reminderDueDate(ev, r){
  const ds = r.type==='abs' ? r.date : (ev.start ? isoDate(addDays(parseDate(ev.start), -(parseInt(r.days,10)||0))) : '');
  if(!ds || !/^\d{4}-\d{2}-\d{2}$/.test(ds)) return null;
  const d = parseDate(ds);
  const m = timeToMin(r.time||'');
  if(m!=null) d.setHours(Math.floor(m/60), m%60, 0, 0);
  return d;
}
function reminderTargetIso(ev, r){ return r.type==='abs' ? r.date : ev.start; }
function calAckKey(ev, r, due){ return ev.id+'|'+r.id+'|'+isoDate(due)+(r.time||''); }
function reminderLabel(ev, r){
  if(r.type==='abs'){
    return (r.text ? r.text+' — ' : 'Påminnelse — ') + fmtDateSv(r.date) + (r.time ? ' kl. '+r.time : '');
  }
  const days = parseInt(r.days,10)||0;
  const when = days===0 ? 'startar i dag' : `startar om ${days} dag${days===1?'':'ar'}`;
  return (r.text ? r.text+' — ' : '') + when + ` (${fmtDateSv(ev.start)})`;
}
function calendarNotices(){
  if(!DATA || !DATA.kalender) return [];
  const now = new Date(), today = todayIso(), out = [];
  calEvents().forEach(ev=>{
    if(ev.cancelled) return;
    (ev.reminders||[]).forEach(r=>{
      const due = reminderDueDate(ev, r);
      if(!due || now<due) return;
      const key = calAckKey(ev, r, due);
      if(DATA.kalender.ack[key]) return;
      const target = reminderTargetIso(ev, r);
      const daysToTarget = Math.round((parseDate(target)-parseDate(today))/86400000);
      out.push({
        kind:'calendar', section:'kalender', level: daysToTarget<0 ? 'red' : 'orange',
        groupName:`Kalender · ${fmtDateSv(ev.start)} · v. ${weekCode(parseDate(ev.start))}`,
        personName: ev.title, text: reminderLabel(ev, r),
        sortKey: daysToTarget, date: ev.start, eventId: ev.id,
        ackCall:`ackCalReminder('${key}')`, showCall:`calGoto('${ev.start}','${ev.id}')`,
        notifyKey:'k|'+key, notifyTitle: ev.title
      });
    });
  });
  return out;
}
function ackCalReminder(key){
  DATA.kalender.ack[key] = Date.now();

}
/* dagar med aktiva (ej noterade) påminnelser -> 'red' | 'orange' */
function activeReminderDays(){
  const m = new Map();
  NOTICES_CACHE.filter(n=>n.kind==='calendar').forEach(n=>{

}

if(!['week','month','year'].includes(calState.mode)) calState.mode = 'month';
function setCalMode(m){ calState.mode = m; lsSet('calmode', m); rerenderCalendar(); }

function renderCalMonth(){
  const base = parseDate(calState.date);
  const first = new Date(base.getFullYear(), base.getMonth(), 1);
  const last = new Date(base.getFullYear(), base.getMonth()+1, 0);
  const start = startOfWeek(first), end = addDays(startOfWeek(last), 6);
  const idx = buildEventIndex(isoDate(start), isoDate(end));
  const today = todayIso(), rem = activeReminderDays();
  const narrow = window.innerWidth<=760, max = narrow ? 2 : 3;
  let html = `<div class="calMonth"><div class="dh">V</div>${WD_SV.map(w=>`<div class="dh">${w}</div>`).join('')}`;
  for(let w = start; w<=end; w = addDays(w,7)){
    html += `<div class="wkCell" onclick="calGotoWeek('${isoDate(w)}')" title="Visa vecka ${weekCode(w)}">${weekCode(w)}</div>`;
    for(let i=0;i<7;i++){
      const day = addDays(w,i), ds = isoDate(day);
      const evs = idx.get(ds) || [];
      const cls = [day.getMonth()!==base.getMonth()?'out':'', ds===today?'today':'', i>=5?'weekend':''].join(' ');
      const dot = rem.has(ds) ? `<span class="remDot ${rem.get(ds)==='red'?'red':''}" title="Aktiv påminnelse"></span>` : '';
      const chips = evs.slice(0,max).map(evChipHtml).join('') + (evs.length>max ? `<div class="moreLink" onclick="event.stopPropagation();calGotoWeek('${ds}')">+${evs.length-max} till</div>` : '');
      html += `<div class="calDay ${cls}" onclick="openEventModal(null,'${ds}')" title="Ny händelse ${fmtDateSv(ds)}"><span class="dnum">${day.getDate()}</span>${dot}${chips}</div>`;
    }
  }
  return html + `</div>`;
}
const CAL_H0 = 6, CAL_H1 = 22, CAL_RH = 36;
function renderCalWeek(){
  const ws = startOfWeek(parseDate(calState.date));
  const days = [0,1,2,3,4,5,6].map(i=>addDays(ws,i));
  const idx = buildEventIndex(isoDate(days[0]), isoDate(days[6]));
  const today = todayIso(), rem = activeReminderDays();
  const total = (CAL_H1-CAL_H0)*CAL_RH;
  let html = `<div class="calWeekWrap"><div class="calWeek">`;
  html += `<div class="wkBig"><small>Vecka</small><b>${weekCode(ws)}</b></div>`;
  days.forEach((d,i)=>{
    const ds = isoDate(d);
    const dot = rem.has(ds) ? ` <span class="noticeDot ${rem.get(ds)==='red'?'red':''}"></span>` : '';
    html += `<div class="wh ${ds===today?'today':''} ${i>=5?'weekend':''}" onclick="openEventModal(null,'${ds}')" title="Ny heldagshändelse"><div class="wd">${WD_SV[i]}${dot}</div><div class="dd">${d.getDate()} <span style="font-size:11px;font-weight:400;color:var(--ink-faint);">${MONTHS_SV[d.getMonth()].slice(0,3)}</span></div></div>`;
  });
  html += `<div class="alldayLbl">Heldag</div>`;
  days.forEach(d=>{
    const ds = isoDate(d);
    const evs = (idx.get(ds)||[]).filter(ev=>!isTimed(ev));
    html += `<div class="allday" onclick="openEventModal(null,'${ds}')">${evs.map(evChipHtml).join('')}</div>`;
  });
  html += `<div class="hours">${Array.from({length:CAL_H1-CAL_H0},(_,i)=>`<div>${pad2(CAL_H0+i)}:00</div>`).join('')}</div>`;
  const now = new Date();
  days.forEach(d=>{
    const ds = isoDate(d);
    const evs = (idx.get(ds)||[]).filter(isTimed);
    /* enkel kolumnfördelning för överlappande händelser */
    const items = evs.map(ev=>{
      const s = timeToMin(ev.startTime);
      let e = timeToMin(ev.endTime); if(e==null || e<=s) e = s+60;
      return {ev, s, e};
    }).sort((a,b)=>a.s-b.s);
    const clusters = []; let cur = null;
    items.forEach(it=>{
      if(cur && it.s < cur.end){ cur.items.push(it); cur.end = Math.max(cur.end, it.e); }
      else { cur = {items:[it], end:it.e}; clusters.push(cur); }
    });
    clusters.forEach(cl=>{
      const lanes = [];
      cl.items.forEach(it=>{
        let l = lanes.findIndex(endMin=>endMin<=it.s);
        if(l<0){ l = lanes.length; lanes.push(it.e); } else lanes[l] = it.e;
        it.lane = l;
      });
      cl.items.forEach(it=>{ it.lanes = lanes.length; });
    });
    const evHtml = items.map(it=>{
      const c = catOf(it.ev.category);
      let top = (it.s - CAL_H0*60)/60*CAL_RH, h = (it.e - it.s)/60*CAL_RH;
      top = Math.max(0, Math.min(total-18, top)); h = Math.max(18, Math.min(total-top, h));
      const w = 100/it.lanes;
      return `<div class="tEv ${it.ev.cancelled?'cancelled':''}" data-ev="${it.ev.id}" style="top:${top}px;height:${h}px;left:calc(${it.lane*w}% + 2px);width:calc(${w}% - 4px);background:${c.color};" title="${esc(it.ev.title)}" onclick="event.stopPropagation();openEventModal('${it.ev.id}')"><b>${it.ev.startTime}</b> ${eventHasActiveReminder(it.ev)?'🔔 ':''}${esc(it.ev.title)}${it.ev.place?`<br><span style="opacity:.85">${esc(it.ev.place)}</span>`:''}</div>`;
    }).join('');
    let nowLine = '';
    if(ds===today){
      const m = now.getHours()*60+now.getMinutes();
      if(m>=CAL_H0*60 && m<=CAL_H1*60) nowLine = `<div class="nowLine" style="top:${(m-CAL_H0*60)/60*CAL_RH}px"></div>`;
    }
    html += `<div class="dayCol ${ds===today?'today':''}" style="height:${total}px" onclick="calWeekClick(event,'${ds}')">${evHtml}${nowLine}</div>`;
  });
  return html + `</div></div>`;
}
function calWeekClick(e, ds){
  if(e.target!==e.currentTarget) return;
  const h = CAL_H0 + Math.floor(e.offsetY / CAL_RH);
  openEventModal(null, ds, pad2(Math.max(0, Math.min(23, h)))+':00');
}
function renderCalYear(){
  const y = parseDate(calState.date).getFullYear();
  const idx = buildEventIndex(y+'-01-01', y+'-12-31');
  const today = todayIso(), rem = activeReminderDays();
  let html = `<div class="calYear">`;
  for(let m=0;m<12;m++){
    const first = new Date(y, m, 1), last = new Date(y, m+1, 0);
    let rows = '';
    for(let w = startOfWeek(first); w<=last; w = addDays(w,7)){
      rows += `<tr><td class="wk" onclick="calGotoWeek('${isoDate(w)}')" title="Vecka ${weekCode(w)}">${weekCode(w)}</td>`;
      for(let i=0;i<7;i++){
        const d = addDays(w,i), ds = isoDate(d);
        if(d.getMonth()!==m){ rows += `<td class="out"></td>`; continue; }
        const evs = idx.get(ds)||[];
        const has = evs.length>0;
        const style = has ? ` style="background:${catOf(evs[0].category).color}"` : '';
        const dot = rem.has(ds) ? `<span class="mdot ${rem.get(ds)==='red'?'red':''}"></span>` : '';
        const tip = has ? evs.map(e=>e.title).join(', ') : fmtDateSv(ds);
        rows += `<td class="${has?'has':''} ${ds===today?'today':''} ${i>=5?'weekend':''}"${style} title="${esc(tip)}" onclick="calGotoWeek('${ds}')">${d.getDate()}${dot}</td>`;
      }
      rows += `</tr>`;
    }
    html += `<div class="miniMonth"><h4 onclick="calGotoMonth(${y},${m})">${MONTHS_SV[m].replace(/^./,c=>c.toUpperCase())}</h4>
      <table><thead><tr><th>V</th>${WD_SV.map(w=>`<th>${w.slice(0,2)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return html + `</div>`;
}

function readRemindersFromModal(){
  const out = [];
  document.querySelectorAll('#ev_rems .remItem').forEach(item=>{
    const type = item.querySelector('.remType').value==='abs' ? 'abs' : 'rel';
    const r = {id:item.dataset.id || uid(), type, days:0, date:'', time:item.querySelector('.remTime').value||'', text:item.querySelector('.remText').value.trim()};
    if(type==='abs'){ r.date = item.querySelector('.remDate').value; if(!r.date) return; }
    else { r.days = Math.max(0, Math.min(3650, parseInt(item.querySelector('.remDays').value,10)||0)); }
    out.push(r);
  });
  return out;
}
function remSame(a, b){ return a.type===b.type && String(a.days||0)===String(b.days||0) && (a.date||'')===(b.date||'') && (a.time||'')===(b.time||'') && (a.text||'')===(b.text||''); }
function saveEventModal(id, thenShare){
  const title = document.getElementById('ev_title').value.trim();
  if(!title){ document.getElementById('ev_title').focus(); alert('Ange en titel.'); return; }
  const start = document.getElementById('ev_start').value;
  if(!start){ alert('Ange startdatum.'); return; }
  let end = document.getElementById('ev_end').value || start;
  if(end<start) end = start;
  const allDay = document.getElementById('ev_allday').checked;
  let startTime = allDay ? '' : document.getElementById('ev_stime').value;
  let endTime = allDay ? '' : document.getElementById('ev_etime').value;
  const fields = {
    title, category: document.getElementById('ev_cat').value, allDay: allDay || !startTime,
    start, end, startTime, endTime,
    place: document.getElementById('ev_place').value.trim(),
    note: document.getElementById('ev_note').value,
    updated: Date.now()
  };
  if(!fields.allDay && end===start && endTime && timeToMin(endTime)<timeToMin(startTime)) fields.endTime = startTime;
  let rems = readRemindersFromModal();
  let ev;
  if(id){
    ev = calEvents().find(e=>e.id===id);
    if(!ev) return;
    const cancelEl = document.getElementById('ev_cancel');
    fields.cancelled = cancelEl ? cancelEl.checked : !!ev.cancelled;
    /* importerade påminnelser som ändrats eller tagits bort blir egna,
       så att en ny delning från avsändaren inte skriver över dem */
    const removed = new Set(ev.removedRemIds||[]);
    (ev.reminders||[]).forEach(old=>{
      if(old.from!=='import') return;
      const now = rems.find(r=>r.id===old.id);
      if(!now){ removed.add(old.id); return; }
      if(!remSame(old, now)){ removed.add(old.id); now.id = uid(); }
      else now.from = 'import';
    });
    fields.removedRemIds = [...removed];
    Object.assign(ev, fields, {reminders: rems});
  } else {
    ev = Object.assign({id:uid(), created:Date.now(), cancelled:false, removedRemIds:[]}, fields, {reminders: rems});
    DATA.kalender.events.push(ev);
  }
  saveToDisk();
  closeModal();
  calState.date = start;
  renderAll();
  if(thenShare) openCalExportModal([ev.id]);
}
function deleteEvent(id){
  const ev = calEvents().find(e=>e.id===id);
  if(!ev) return;
  if(!confirm(`Ta bort "${ev.title}" ur din kalender?\n\nVill du att mottagarna också ska se att den är inställd: markera den som Inställd och dela den i stället.`)) return;
  DATA.kalender.events = calEvents().filter(e=>e.id!==id);
  DATA.kalender.deleted = DATA.kalender.deleted.concat(id).slice(-500);
  Object.keys(DATA.kalender.ack).forEach(k=>{ if(k.startsWith(id+'|')) delete DATA.kalender.ack[k]; });
  saveToDisk(); closeModal(); renderAll();
}

async function calImportGo(){

  catch(e){ if(e && e.message!=='avbrutet') alert('Texten kunde inte låsas upp: '+(e.message||e)); return; }

  const ex = splitExtras(text);
  if(!ex.cal && !ex.notes){ alert('Hittade inga kalenderhändelser i texten. Personaluppgifter läses in via "Importera personal" eller "Importera från Slack".'); return; }
  closeModal();
  await offerExtras(ex);
}

/* ---------- extradelar i en importerad text ---------- */
function splitExtras(text){
  const out = {text:'', cal:null, notes:null, bad:false};
  out.text = String(text||'').replace(/^[ \t]*#PR-(KAL1|ANS1)[ \t]+(.+)$/gm, (m, tag, json)=>{
    try{ const o = JSON.parse(json); if(tag==='KAL1') out.cal = o; else out.notes = o; }catch(e){ out.bad = true; }
    return '';
  });
  return out;
}
async function routeImport(text, personsFn){
  const ex = splitExtras(text);
  if(!ex.cal && !ex.notes){
    if(ex.bad) alert('En del av texten (kalender/anslagstavla) kunde inte läsas och hoppades över.');
    personsFn(ex.text);
    return;
  }
  if(ex.text.trim()) personsFn(ex.text);
  else closeModal();
  await offerExtras(ex);
}
function askYesNo(title, html, yes, no){

    const overlay = document.createElement('div');

      <div class="modal-actions"><button class="btn" id="ynNo">${esc(no)}</button><button class="btn primary" id="ynYes">${esc(yes)}</button></div></div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#ynNo').onclick = ()=>{ overlay.remove(); resolve(false); };
    overlay.querySelector('#ynYes').onclick = ()=>{ overlay.remove(); resolve(true); };
  });
}
async function offerExtras(ex){
  if(ex.cal && Array.isArray(ex.cal.events) && ex.cal.events.length){
    const pv = mergeEvents(ex.cal.events, true);
    const n = ex.cal.events.length;
    const parts = [];
    if(pv.added) parts.push(`${pv.added} ny${pv.added===1?'':'a'}`);
    if(pv.updated) parts.push(`${pv.updated} uppdaterad${pv.updated===1?'':'e'}`);
    if(pv.same) parts.push(`${pv.same} redan aktuell${pv.same===1?'':'a'}`);
    if(pv.older) parts.push(`${pv.older} där din version är nyare`);
    if(pv.deleted) parts.push(`${pv.deleted} som du tagit bort`);
    if(pv.invalid) parts.push(`${pv.invalid} oläsbar${pv.invalid===1?'':'a'}`);
    if(!pv.added && !pv.updated){
      alert(`Texten innehåller ${n} kalenderhändelse${n===1?'':'r'}, men det finns inget nytt att lägga till (${parts.join(', ')}).`);
    } else {
    const ok = await askYesNo('Kalenderhändelser',
      `<p>Texten innehåller <strong>${n} kalenderhändelse${n===1?'':'r'}</strong>: ${esc(parts.join(', '))}.</p><p>Vill du lägga till dem i din kalender? Nya läggs till och samma händelse uppdateras — dina egna händelser tas aldrig bort eller skrivs över. Påminnelser du själv lagt till eller ändrat behålls.</p>`,
      'Lägg till', 'Hoppa över');
    if(ok){
      mergeEvents(ex.cal.events, false);
      saveToDisk(); renderAll();
    }
    }
  }
  if(ex.notes && Array.isArray(ex.notes.notes) && ex.notes.notes.length){
    const pv = mergeNotes(ex.notes.notes, true);
    const n = ex.notes.notes.length;
    if(!pv.added && !pv.updated){ alert(`Texten innehåller ${n} lapp${n===1?'':'ar'} från en anslagstavla, men inget nytt att lägga till.`); return; }
    const ok = await askYesNo('Anslagstavlan',
      `<p>Texten innehåller <strong>${n} lapp${n===1?'':'ar'}</strong> från en anslagstavla: ${pv.added} ny${pv.added===1?'':'a'}, ${pv.updated} uppdaterad${pv.updated===1?'':'e'}${pv.same?`, ${pv.same} redan aktuell${pv.same===1?'':'a'}`:''}${pv.deleted?`, ${pv.deleted} som du gallrat`:''}.</p><p>Vill du lägga till dem på din tavla? Dina egna lappar tas aldrig bort.</p>`,
      'Lägg till', 'Hoppa över');
    if(ok && (pv.added || pv.updated)){
      mergeNotes(ex.notes.notes, false);
      saveToDisk(); renderAll();
    }
  }
}
function cleanRem(r){
  if(!r || typeof r!=='object') return null;
  const id = String(r.id||''); if(!SAFE_ID_RE.test(id)) return null;
  const type = r.type==='abs' ? 'abs' : 'rel';
  const date = /^\d{4}-\d{2}-\d{2}$/.test(r.date||'') ? r.date : '';
  if(type==='abs' && !date) return null;
  return {id, type, days: Math.max(0, Math.min(3650, parseInt(r.days,10)||0)), date,
    time: /^\d{2}:\d{2}$/.test(r.time||'') ? r.time : '', text: String(r.text||'').slice(0,300)};
}
function cleanEvent(e){
  if(!e || typeof e!=='object') return null;
  const id = String(e.id||''); if(!SAFE_ID_RE.test(id)) return null;
  const date = s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'') ? s : '';
  const time = s=>/^\d{2}:\d{2}$/.test(s||'') ? s : '';
  const start = date(e.start); if(!start) return null;
  let end = date(e.end) || start; if(end<start) end = start;
  return {id, title: String(e.title||'(utan titel)').slice(0,200),
    category: CAL_CATS.some(c=>c.key===e.category) ? e.category : 'ovrigt',
    allDay: !!e.allDay, start, end, startTime: time(e.startTime), endTime: time(e.endTime),
    place: String(e.place||'').slice(0,200), note: String(e.note||'').slice(0,4000),
    cancelled: !!e.cancelled, updated: Number(e.updated)||0,
    reminders: (Array.isArray(e.reminders)?e.reminders:[]).map(cleanRem).filter(Boolean).slice(0,30)};
}
function mergeEvents(list, dry){
  const res = {added:0, updated:0, same:0, older:0, deleted:0, invalid:0};
  list.forEach(raw=>{
    const inc = cleanEvent(raw);
    if(!inc){ res.invalid++; return; }
    if(DATA.kalender.deleted.includes(inc.id)){ res.deleted++; return; }
    inc.reminders.forEach(r=>{ r.from = 'import'; });
    const cur = calEvents().find(e=>e.id===inc.id);
    if(!cur){
      res.added++;
      if(!dry) DATA.kalender.events.push(Object.assign(inc, {removedRemIds:[]}));
      return;
    }
    if(inc.updated < (cur.updated||0)){ res.older++; return; }
    if(inc.updated === (cur.updated||0)){ res.same++; return; }
    res.updated++;
    if(dry) return;
    const removed = cur.removedRemIds || [];
    const incRems = inc.reminders.filter(r=>!removed.includes(r.id));
    const own = (cur.reminders||[]).filter(r=>r.from!=='import' && !incRems.some(x=>x.id===r.id));
    Object.assign(cur, inc, {reminders: incRems.concat(own), removedRemIds: removed});
  });
  return res;
}

function nextNoteZ(){ return boardNotes().reduce((m,n)=>Math.max(m, n.z||0), 0) + 1; }
function noteDueDate(n){
  if(!n.remind || !n.remind.date) return null;
  const d = parseDate(n.remind.date);
  const m = timeToMin(n.remind.time||'');
  if(m!=null) d.setHours(Math.floor(m/60), m%60, 0, 0);
  return d;
}
function noteRemState(n){
  const due = noteDueDate(n);
  if(!due) return {};
  const label = fmtDateSv(n.remind.date) + (n.remind.time ? ' kl. '+n.remind.time : '');
  if(n.remindAck) return {label: label+' (noterad)'};
  if(new Date()>=due) return {due:true, cls:'due', label};
  const days = Math.round((parseDate(n.remind.date)-parseDate(todayIso()))/86400000);
  return {cls: days<=3 ? 'warn' : '', label};
}
function boardNotices(){
  if(!DATA || !DATA.anslag) return [];
  const out = [], now = new Date(), today = todayIso();
  boardNotes().forEach(n=>{
    if(n.done || n.remindAck) return;
    const due = noteDueDate(n);
    if(!due || now<due) return;
    const days = Math.round((parseDate(n.remind.date)-parseDate(today))/86400000);
    out.push({kind:'boardnote', section:'anslag', level: days<0 ? 'red' : 'orange', groupName:'Anslagstavlan · '+fmtDateSv(n.remind.date),
      personName:'', text: excerpt(n.text,120) || '(tom lapp)', sortKey: days, noteId:n.id,
      ackCall:`ackNoteRemind('${n.id}')`, showCall:`showNote('${n.id}')`,
      notifyKey:'n|'+n.id+'|'+n.remind.date+(n.remind.time||''), notifyTitle: excerpt(n.text,60) || 'Lapp på anslagstavlan'});
  });
  const old = oldDoneNotes();
  if(old.length && !(DATA.anslag.gallringSnooze && Date.now()<DATA.anslag.gallringSnooze)){
    out.push({kind:'gallring', section:'anslag', level:'orange', groupName:'Anslagstavlan', personName:'',
      text:`${old.length} klar${old.length===1?'':'a'} lapp${old.length===1?'':'ar'} har legat i högen i mer än ${NOTE_GALLRING_DAYS} dagar — gallra?`,
      sortKey:-240000, ackCall:'openNoteGallring(false)', ackLabel:'Gallra…'});
  }
  return out;
}

function freeNoteSpot(){
  const act = boardNotes().filter(n=>!n.done);
  for(let row=0; row<40; row++){
    for(let col=0; col<6; col++){
      const x = 24 + col*196, y = 24 + row*190;
      if(!act.some(n=>Math.abs((n.x||0)-x)<NOTE_W-30 && Math.abs((n.y||0)-y)<NOTE_H-30)) return {x, y};
    }
  }
  return {x:24, y:24};
}

  if(b){ b.textContent = `Gallra markerade (${n})`; b.disabled = !n; }
}
function snoozeNoteGallring(manual){
  if(!manual){ DATA.anslag.gallringSnooze = Date.now() + 7*86400000; saveToDisk(); }
  closeModal(); renderAll();
}
function runNoteGallring(){
  const ids = [...document.querySelectorAll('.noteGallrPick:checked')].map(c=>c.value);
  if(!ids.length) return;
  DATA.anslag.notes = boardNotes().filter(n=>!ids.includes(n.id));
  DATA.anslag.deleted = DATA.anslag.deleted.concat(ids).slice(-500);
  DATA.anslag.gallringSnooze = 0;
  saveToDisk(); closeModal(); renderAll();
}
/* ---- dra lappar (mus och finger) ---- */
document.addEventListener('pointerdown', e=>{
  const grip = e.target.closest && e.target.closest('.note .grip');
  if(!grip || e.target.closest('button') || !DATA) return;
  const el = grip.closest('.note');
  const n = findNote(el.dataset.id); if(!n) return;
  e.preventDefault();
  n.z = nextNoteZ(); el.style.zIndex = n.z;
  boardDrag = {el, n, sx:e.clientX, sy:e.clientY, ox:n.x||0, oy:n.y||0, nx:n.x||0, ny:n.y||0, s: window.__boardScale||1, pid:e.pointerId};
  el.classList.add('dragging');
  try{ grip.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener('pointermove', e=>{
  const d = boardDrag;
  if(!d || e.pointerId!==d.pid) return;
  d.nx = Math.round(Math.max(0, Math.min(BOARD_W-NOTE_W, d.ox + (e.clientX-d.sx)/d.s)));
  d.ny = Math.round(Math.max(0, d.oy + (e.clientY-d.sy)/d.s));
  d.el.style.left = d.nx+'px'; d.el.style.top = d.ny+'px';
  const canvas = document.getElementById('boardCanvas');
  if(canvas && d.ny+NOTE_H+60 > parseFloat(canvas.style.height)){
    canvas.style.height = (d.ny+NOTE_H+60)+'px'; layoutBoard();
  }
});
function endBoardDrag(e){
  const d = boardDrag;
  if(!d || (e && e.pointerId!==d.pid)) return;
  boardDrag = null;
  d.el.classList.remove('dragging');
  if(d.nx!==d.ox || d.ny!==d.oy){ d.n.x = d.nx; d.n.y = d.ny; d.n.updated = Date.now(); newNoteIds.delete(d.n.id); }
  saveToDisk();
}
document.addEventListener('pointerup', endBoardDrag);
document.addEventListener('pointercancel', endBoardDrag);
/* stäng färgpaletten om man klickar utanför */
document.addEventListener('click', e=>{
  if(e.target.closest && e.target.closest('.note')) return;
  document.querySelectorAll('.note.showColors').forEach(n=>n.classList.remove('showColors'));
});
function cleanNote(n){
  if(!n || typeof n!=='object') return null;
  const id = String(n.id||''); if(!SAFE_ID_RE.test(id)) return null;
  const num = (v, lo, hi, def)=>{ v = Number(v); return isFinite(v) ? Math.max(lo, Math.min(hi, v)) : def; };
  const remind = (n.remind && /^\d{4}-\d{2}-\d{2}$/.test(n.remind.date||'')) ? {date:n.remind.date, time:/^\d{2}:\d{2}$/.test(n.remind.time||'')?n.remind.time:''} : null;
  return {id, text:String(n.text||'').slice(0,1000), color: NOTE_COLORS.some(c=>c.key===n.color)?n.color:'gul',
    x:num(n.x,0,BOARD_W-NOTE_W,24), y:num(n.y,0,20000,24), rot:num(n.rot,-4,4,0), z:num(n.z,0,1e6,1),
    remind, remindAck:!!n.remindAck, done:!!n.done, doneAt:num(n.doneAt,0,1e14,0),
    created:num(n.created,0,1e14,0), updated:num(n.updated,0,1e14,0)};
}
function mergeNotes(list, dry){
  const res = {added:0, updated:0, same:0, deleted:0};
  list.forEach(raw=>{
    const inc = cleanNote(raw); if(!inc) return;
    if(DATA.anslag.deleted.includes(inc.id)){ res.deleted++; return; }
    const cur = findNote(inc.id);
    if(!cur){ res.added++; if(!dry) DATA.anslag.notes.push(inc); return; }
    if(inc.updated <= (cur.updated||0)){ res.same++; return; }
    res.updated++;
    if(!dry) Object.assign(cur, inc);
  });
  return res;
}

function maybeShowWhatsNew(){

  try{ seen = localStorage.getItem(LS_SEEN_VERSION); }catch(e){}
  if(seen===APP_VERSION) return;
  try{ localStorage.setItem(LS_SEEN_VERSION, APP_VERSION); }catch(e){}

  let idx = APP_CHANGELOG.findIndex(c=>c.version===seen);
  if(idx<1) idx = 1; // okänd/äldre version: visa senaste uppdateringen
  const entries = APP_CHANGELOG.slice(0, idx);

/* ---------- PWA: offline-stöd och beständig lagring ---------- */
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  const hadController = !!navigator.serviceWorker.controller;
  let reloadOffered = false;
  navigator.serviceWorker.addEventListener('controllerchange', async ()=>{
    if(!hadController || reloadOffered) return; // första installationen
    /* Visa bara rutan om den nya versionen är en annan än den som körs. */
    try{
      const ctrl = navigator.serviceWorker.controller;
      if(ctrl && ctrl.state!=='activated'){
        await new Promise(res=>{
          ctrl.addEventListener('statechange', ()=>{ if(ctrl.state==='activated' || ctrl.state==='redundant') res(); });
          setTimeout(res, 10000);
        });
      }
      const keys = await caches.keys();
      if(keys.includes(SW_CACHE_VERSION)) return;
    }catch(e){}
    reloadOffered = true;
    showUpdateToast();
  });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      /* leta efter ny version när appen tas fram igen, och varje timme */
      const check = ()=>{ reg.update().catch(()=>{}); };
      document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) check(); });
      setInterval(check, 60*60*1000);
    }).catch(e=>console.warn('Service worker:', e));
  });
}
if(navigator.storage && navigator.storage.persist){
