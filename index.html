<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Personalregister</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#102442">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Personalregister">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&display=swap" rel="stylesheet">
<script src="xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#3C4F4F;
    --panel:#FFFFFF;
    --ink:#14181B;
    --ink-soft:#454B4F;
    --ink-faint:#82888B;
    --line:#DBDBD6;
    --line-strong:#AFB0A9;
    --accent:#6B5416;
    --accent-ink:#FFFFFF;
    --accent-soft:#ECE3CE;
    --accent-bright:#D4AF37;
    --navy:#102442;
    --navy-ink:#FFFFFF;
    --warn:#95661E;
    --warn-soft:#F1E3CC;
    --danger:#8C3B32;
    --danger-soft:#F1DBD6;
    --radius:2px;
    --font-head:'Allerta Stencil','Arial Narrow','Roboto Condensed','Oswald',Arial,Helvetica,sans-serif;
    --font-body:Arial,Helvetica,'Segoe UI',Roboto,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.45;
    min-height:100vh;
  }
  h1,h2,h3{font-family:var(--font-head);font-weight:800;letter-spacing:.015em;margin:0;}
  button{font-family:inherit;font-size:13px;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:13px;}
  a{color:var(--accent);}
  ::selection{background:var(--accent-soft);}

  /* ---------- layout shell ---------- */
  #topbar{
    background:var(--navy);
    color:var(--navy-ink);
    padding:26px 28px 210px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    position:relative;
  }
  /* zigzag contour separating the navy header from the green page background,
     traced from a reference artwork and rotated so it reads at a 24° incline
     (right edge high, left edge low). Uses aspect-ratio so the true angle is
     kept up to a sensible header height, then caps out on very wide screens. */
  #topbarEdge{
    position:absolute;
    left:0; right:0; top:100%;
    height:clamp(90px, 62.85vw, 200px);
    pointer-events:none;
  }
  #topbarEdge svg{display:block;width:100%;height:100%;}
  #titleRow{display:flex;align-items:center;gap:18px;}
  #headerLogo{height:110px;width:auto;display:block;flex-shrink:0;}
  #titleWrap{display:flex;flex-direction:column;gap:2px;}
  #titleWrap .eyebrow{font-size:11px;letter-spacing:.12em;color:var(--accent-bright);font-weight:700;}
  #titleEl{
    font-size:66px;
    color:#fff;
    text-transform:uppercase;
    border:1px solid transparent;
    padding:2px 4px;
    border-radius:var(--radius);
    cursor:text;
  }
  #titleEl:hover{border-color:rgba(255,255,255,.35);}
  #titleEl:focus{outline:none;border-color:var(--accent-bright);background:rgba(255,255,255,.08);color:#fff;}
  #unitMeta{display:flex;gap:16px;margin-top:6px;}
  #unitMeta label{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.78);font-weight:600;letter-spacing:.02em;}
  #unitMeta input{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    border-radius:var(--radius);
    padding:3px 6px;
    font-size:13px;
    font-family:var(--font-body);
    text-transform:uppercase;
    text-align:center;
  }
  #unitMeta input#kompaniEl{width:44px;}
  #unitMeta input#plutonEl{width:34px;}
  #unitMeta input:focus{outline:none;border-color:var(--accent-bright);background:rgba(255,255,255,.14);}
  #unitMeta input:disabled{opacity:.4;}
  #topActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  /* header buttons/select 10% larger + a touch clearer than the app's normal buttons */
  #topActions .btn, #topActions select.btn{
    font-size:14px;
    padding:5px 15px;
    font-weight:700;
  }
  .btn{
    background:var(--panel);
    border:1px solid var(--line-strong);
    color:var(--ink);
    padding:7px 13px;
    border-radius:var(--radius);
    font-weight:600;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .btn.primary:hover{opacity:.9;color:var(--accent-ink);}
  .btn.danger{border-color:var(--danger);color:var(--danger);}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn.small{padding:4px 9px;font-size:12px;}
  .btn.tiny{padding:2px 7px;font-size:11px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .status{font-size:12px;color:rgba(255,255,255,.65);align-self:center;}

  #app{padding:26px 28px 60px;max-width:1600px;margin:-180px auto 0;position:relative;}

  .banner{
    background:var(--warn-soft);
    border:1px solid var(--warn);
    color:#4a3410;
    padding:12px 16px;
    border-radius:var(--radius);
    margin-bottom:20px;
    font-size:13px;
  }
  .banner.info{background:#F2F3EE;border-color:var(--line-strong);color:var(--ink-soft);}
  .banner.setup{background:var(--panel);border:1px dashed var(--line-strong);color:var(--ink-soft);text-align:center;padding:60px 20px;}
  .banner.setup h2{color:var(--ink);margin-bottom:10px;font-size:20px;}
  .banner.setup p{max-width:520px;margin:0 auto 18px;}

  /* ---------- home: notice box + group rows ---------- */
  #homeLayout{
    display:flex;
    align-items:stretch;
    gap:18px;
    margin-top:6px;
  }
  #homeGroups{flex:1 1 auto;min-width:0;}
  /* notice box sits left of the group list; stretched to the group list's
     own height (never taller) and capped narrow (not wider than half of
     that height on a typical screen), with its own item list scrolling
     internally when there are more notices than fit. */
  #noticeBox{
    flex:0 0 300px;
    max-width:300px;
    display:flex;
    flex-direction:column;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--accent-bright);
    border-radius:var(--radius);
    overflow:hidden;
  }
  #noticeBox .noticeHead{
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    font-family:var(--font-head);
    font-size:15px;
    flex:0 0 auto;
  }
  #noticeBox .noticeHead .count{font-family:var(--font-body);font-weight:400;color:var(--ink-faint);font-size:12px;}
  #noticeBox .noticeList{
    flex:1 1 auto;
    overflow-y:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .noticeItem{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 9px;
    font-size:12px;
    background:var(--warn-soft);
  }
  .noticeItem.grade{background:var(--accent-soft);}
  .noticeItem.training{background:#E3ECFA;border-color:#9DB8E6;}
  .noticeItem.move{background:#FBEFD9;border-color:#E3B866;}
  /* blåbandare — namn med blå text */
  strong.trainee, .trainee{color:#1F5FBF;}
  .traineeTag{display:inline-block;font-size:11px;font-weight:600;color:#1F5FBF;background:#E3ECFA;border:1px solid #9DB8E6;border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle;}
  .noticeItem .noticeGroup{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:600;}
  .noticeItem .noticeText{margin:3px 0 7px;color:var(--ink);}
  .noticeEmpty{color:var(--ink-faint);font-style:italic;font-size:12px;padding:4px 2px;}
  @media (max-width:900px){
    #homeLayout{flex-direction:column;}
    #noticeBox{max-width:none;flex:0 0 auto;max-height:320px;}
  }

  #groupGrid{
    display:flex;
    flex-direction:column;
    gap:18px;
    margin-top:6px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:var(--radius);
    overflow:hidden;
    width:100%;
  }
  .card.kind-recruit{border-left-color:var(--warn);}
  .card.kind-offboarding{border-left-color:var(--danger);}
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    gap:8px;
    flex-wrap:wrap;
  }
  .card-head h3{
    font-size:17px;
    cursor:pointer;
    padding:2px 4px;
    border-radius:var(--radius);
  }
  .card-head h3:hover{background:var(--accent-soft);}
  .card-head input.groupNameEdit{
    font-family:var(--font-head);
    font-size:17px;
    font-weight:600;
    border:1px solid var(--accent);
    border-radius:var(--radius);
    padding:2px 4px;
    width:280px;
    max-width:60%;
  }
  .card-count{font-size:11px;color:var(--ink-faint);}
  table{width:100%;border-collapse:collapse;}
  .mini-table{table-layout:auto;}
  .mini-table th{
    text-align:left;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-faint);
    font-weight:600;
    padding:6px 14px 6px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  .mini-table td{
    padding:7px 14px;
    border-bottom:1px solid var(--line);
    font-size:13px;
    vertical-align:top;
  }
  .mini-table tbody tr:last-child td{border-bottom:none;}
  .mini-table tbody tr.datarow{cursor:pointer;}
  .mini-table tbody tr.datarow:hover{background:var(--accent-soft);}
  .mini-table tbody tr.vacant{color:var(--ink-faint);}
  .mini-table tbody tr.vacant:hover{background:var(--accent-soft);}
  .empty-row td{color:var(--ink-faint);font-style:italic;cursor:default;}
  .empty-row:hover{background:transparent !important;}

  /* ---------- copy-to-clipboard for individual values ---------- */
  .copyCell{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .copyIconBtn{
    display:inline-flex;align-items:center;justify-content:center;
    flex-shrink:0;width:22px;height:22px;padding:0;
    background:transparent;border:1px solid transparent;border-radius:var(--radius);
    color:var(--ink-faint);
  }
  .copyIconBtn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--line);}
  .copyIconBtn.copied{color:#2f6b3a;}
  .contactPanel{
    display:flex;flex-wrap:wrap;gap:10px 26px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 16px;margin-bottom:16px;font-size:13px;
  }
  .contactItem{display:flex;align-items:center;gap:7px;}
  .contactItem .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600;}
  .card-foot{padding:10px 14px;border-top:1px solid var(--line);}

  /* ---------- breadcrumb / view header ---------- */
  .viewhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .crumbs{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:6px;}
  .crumbs a{color:rgba(255,255,255,.88);text-decoration:none;cursor:pointer;}
  .crumbs a:hover{color:var(--accent-bright);text-decoration:underline;}
  .viewhead h2{font-size:22px;text-transform:uppercase;letter-spacing:.01em;color:#fff;}
  .viewhead .sub{color:rgba(255,255,255,.78);font-size:13px;margin-top:2px;}
  .headActions{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- settings: column order ---------- */
  #columnPanel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:18px;
  }
  #columnPanel h4{font-size:13px;margin-bottom:10px;color:var(--ink-soft);font-weight:600;}
  .colrow{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px;
  }
  .colrow:last-child{border-bottom:none;}
  .colrow .arrows{display:flex;gap:4px;}
  .arrowbtn{border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--radius);width:24px;height:22px;line-height:1;padding:0;}
  .arrowbtn:hover{border-color:var(--accent);color:var(--accent);}
  .arrowbtn:disabled{opacity:.3;cursor:not-allowed;}

  /* ---------- full register table ---------- */
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;}
  table.full{width:100%;border-collapse:collapse;min-width:900px;}
  table.full th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
    color:var(--ink-faint);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line-strong);
    white-space:nowrap;background:#FAF9F5;
  }
  table.full td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap;}
  table.full tbody tr.datarow:hover{background:var(--accent-soft);}
  table.full tbody tr.vacant{background:#FCFBF8;}
  table.full td.clickable{cursor:pointer;}
  table.full td.slotfield{cursor:text;}
  table.full td.slotfield:hover{background:var(--accent-soft);}
  table.full td.actions{white-space:nowrap;text-align:right;}
  .rowActions{display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap;}
  .rowActions select{border:1px solid var(--line-strong);border-radius:var(--radius);padding:3px 5px;font-size:12px;}
  .stepCell select{border:1px solid var(--line-strong);border-radius:var(--radius);padding:4px 6px;}
  .stepCell input[type=date]{border:1px solid var(--line-strong);border-radius:var(--radius);padding:3px 4px;margin-left:4px;}

  /* ---------- person view tabs ---------- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-strong);margin-bottom:18px;}
  .tab{
    padding:10px 20px;border:1px solid transparent;border-bottom:none;
    border-radius:var(--radius) var(--radius) 0 0;color:rgba(255,255,255,.8);font-weight:700;
    font-size:16px;letter-spacing:.01em;background:transparent;
  }
  .tab.active{background:var(--panel);border-color:var(--line-strong);color:var(--accent);position:relative;top:1px;}
  .tab:hover:not(.active){color:#fff;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}

  .comp-row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);gap:14px;flex-wrap:wrap;}
  .comp-row:last-child{border-bottom:none;}
  .comp-label{display:flex;align-items:center;gap:10px;font-weight:500;}
  .comp-label.caps{letter-spacing:.02em;}
  .checkwrap{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  .checkwrap input{width:16px;height:16px;accent-color:var(--accent);}
  .expiry{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);}
  .expiry input{border:1px solid var(--line-strong);border-radius:var(--radius);padding:4px 6px;}
  .pill{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600;}
  .pill.ok{background:var(--accent-soft);color:var(--accent);}
  .pill.warn{background:var(--warn-soft);color:var(--warn);}
  .pill.expired{background:var(--danger-soft);color:var(--danger);}
  .addCompRow{padding-top:14px;margin-top:6px;border-top:1px dashed var(--line-strong);}

  table.exercise{border-collapse:collapse;width:100%;}
  table.exercise th,table.exercise td{border:1px solid var(--line);padding:8px 10px;text-align:left;font-size:13px;vertical-align:top;}
  table.exercise th{background:#FAF9F5;font-weight:600;}
  table.exercise td.year{text-align:left;font-weight:600;background:#FAF9F5;white-space:nowrap;}
  table.exercise tr.yearOk td.year{color:var(--accent);}
  table.exercise tr.yearOk{background:var(--accent-soft);}
  .exwrap{display:flex;flex-direction:column;gap:4px;}
  .miniCheck{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;user-select:none;}
  .miniCheck input{width:14px;height:14px;}
  .reason{border:1px solid var(--line-strong);border-radius:var(--radius);padding:4px 6px;font-size:12px;margin-top:2px;}

  .plan-year{margin-bottom:14px;}
  .plan-year label{display:block;font-weight:600;font-size:13px;margin-bottom:5px;color:var(--ink-soft);}
  .plan-year textarea{
    width:100%;min-height:64px;border:1px solid var(--line-strong);border-radius:var(--radius);
    padding:8px 10px;resize:vertical;font-family:var(--font-body);
  }
  .plan-year textarea:focus{outline:none;border-color:var(--accent);}

  /* ---------- overview matrix ---------- */
  .ov-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;}
  table.matrix{border-collapse:collapse;min-width:1200px;}
  table.matrix th,table.matrix td{border:1px solid var(--line);padding:5px 7px;text-align:center;font-size:11px;}
  table.matrix th{background:#FAF9F5;font-weight:600;white-space:nowrap;}
  table.matrix td.name{text-align:left;font-weight:600;white-space:nowrap;font-size:12px;background:#FAF9F5;position:sticky;left:0;}
  table.matrix .yes{color:var(--accent);font-weight:700;}
  table.matrix .yes.yearOk{background:var(--accent-soft);}
  table.matrix .absent{color:var(--danger);font-weight:700;}
  table.matrix .no{color:var(--line-strong);}
  table.matrix td.pct{font-weight:700;}
  table.matrix td.pct.low{color:var(--danger);}
  table.matrix td.pct.mid{color:var(--warn);}
  table.matrix td.pct.high{color:var(--accent);}

  /* ---------- statistics ---------- */
  .pctgood{color:var(--accent);font-weight:700;}
  .pctneed{color:var(--danger);font-weight:700;}
  table.stats input[type=number]{width:72px;text-align:center;border:1px solid var(--line-strong);border-radius:var(--radius);padding:5px 6px;}
  table.stats td, table.stats th{text-align:center;}
  table.stats td:first-child, table.stats th:first-child{text-align:left;}

  /* ---------- grade (grad) overview ---------- */
  table.gradeTable{width:100%;border-collapse:collapse;min-width:820px;}
  table.gradeTable th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-faint);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line-strong);
  }
  table.gradeTable td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;white-space:normal;}
  table.gradeTable tbody tr:hover{background:var(--accent-soft);}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,24,20,.45);
    display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:50;
  }
  .modal{background:var(--panel);border-radius:var(--radius);width:100%;max-width:600px;padding:24px 26px;border:1px solid var(--line-strong);}
  .modal h3{font-size:19px;margin-bottom:16px;}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .formgrid .full{grid-column:1/-1;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select{width:100%;border:1px solid var(--line-strong);border-radius:var(--radius);padding:7px 9px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .field.checkfield{display:flex;align-items:center;gap:8px;margin-top:22px;}
  .field.checkfield input{width:16px;height:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

  .empty-state{padding:50px 20px;text-align:center;color:rgba(255,255,255,.6);}

  /* ---------- PIN-lås ---------- */
  #lockScreen{
    position:fixed;inset:0;z-index:200;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;
    padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }
  #lockScreen .lockBox{width:100%;max-width:340px;text-align:center;}
  #lockScreen img{height:88px;margin-bottom:12px;}
  #lockScreen h2{font-size:22px;margin-bottom:6px;text-transform:uppercase;}
  #lockScreen .lockMsg{font-size:14px;color:rgba(255,255,255,.8);min-height:20px;margin-bottom:16px;}
  #lockScreen .lockMsg.err{color:#F3B3AA;font-weight:700;}
  .pinDots{display:flex;justify-content:center;gap:12px;margin:6px 0 20px;}
  .pinDots span{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.7);}
  .pinDots span.on{background:var(--accent-bright);border-color:var(--accent-bright);}
  .pinPad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto;}
  .pinPad button{
    height:62px;border-radius:31px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);
    color:#fff;font-size:26px;font-weight:600;font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .pinPad button:active{background:rgba(255,255,255,.25);}
  .pinPad button.fn{font-size:14px;border-color:transparent;background:transparent;}
  .pinPad button:disabled{opacity:.35;}
  #lockScreen .lockLink{margin-top:22px;background:none;border:none;color:rgba(255,255,255,.7);text-decoration:underline;font-size:13px;}
  #lockScreen .lockNote{margin-top:14px;font-size:12px;color:rgba(255,255,255,.6);line-height:1.5;}
  body.locked #app, body.locked #topbar{visibility:hidden;}

  /* ---------- meny-knapp (visas bara på smala skärmar) ---------- */
  #menuToggle{display:none;align-items:center;gap:8px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:var(--radius);padding:9px 14px;font-weight:700;font-size:15px;}
  #installBanner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}

  /* ---------- mobil / surfplatta i stående läge ---------- */
  @media (max-width:760px){
    #topbar{
      padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 14px calc(14px + env(safe-area-inset-left));
      align-items:center;gap:10px;
    }
    #topbarEdge{display:none;}
    #titleRow{gap:10px;flex:1 1 0;min-width:0;}
    #titleWrap{min-width:0;}
    #headerLogo{height:48px;}
    #titleEl{font-size:22px;line-height:1.1;overflow-wrap:anywhere;padding:1px 2px;}
    #titleWrap .eyebrow{font-size:9px;}
    #unitMeta{gap:10px;margin-top:3px;}
    #unitMeta label{font-size:11px;}
    #menuToggle{display:inline-flex;}
    #topActions{display:none;width:100%;flex-direction:column;align-items:stretch;gap:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.2);}
    body.menuOpen #topActions{display:flex;}
    #topActions .btn, #topActions select.btn, #topActions label.btn{width:100%;max-width:none !important;text-align:left;padding:11px 14px;font-size:15px;}
    #topActions .status{padding:2px 4px;}
    #app{margin-top:0;padding:14px calc(12px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));}
    .viewhead{margin-bottom:12px;}
    .viewhead h2{font-size:19px;overflow-wrap:anywhere;}
    .headActions{width:100%;}
    .formgrid{grid-template-columns:1fr;}
    table.full{min-width:640px;}
    #noticeBox{max-height:260px;}
    /* större tryckytor */
    .btn{padding:9px 14px;}
    .btn.small{padding:8px 12px;font-size:13px;}
    .btn.tiny{padding:6px 10px;font-size:12px;}
    .copyIconBtn{width:32px;height:32px;}
    .arrowbtn{width:34px;height:32px;}
    /* 16px i fält hindrar iPhone från att zooma in när man trycker i dem */
    input,select,textarea,.field input,.field select,.reason,.expiry input,.stepCell select,.rowActions select{font-size:16px;}
    .checkwrap input,.miniCheck input{width:20px;height:20px;}
    .overlay{padding:calc(10px + env(safe-area-inset-top)) 8px 20px;}
    .modal{padding:18px 16px;}
    .modal h3{font-size:17px;}
    .modal-actions{flex-wrap:wrap;}
    .modal-actions .btn{flex:1 1 auto;}
    .banner{overflow-wrap:anywhere;}
    .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tab{padding:9px 14px;font-size:14px;white-space:nowrap;}
    .panel{padding:14px 12px;}
    .contactPanel{flex-direction:column;gap:8px;}
    .card-head{padding:10px 12px;}
    .mini-table th,.mini-table td{padding:7px 10px;}
    table.exercise th,table.exercise td{padding:6px 7px;}
  }
</style>
</head>

<script>
/* =========================================================================
   PERSONALREGISTER
   Fristående app. Registren sparas alltid krypterade (AES-256-GCM, nyckel
   från PIN-koden) i appens eget lagringsutrymme på enheten — likadant på
   PC, Android och iPhone. Inget mappval. Använd Exportera JSON som
   säkerhetskopia och för att flytta registret mellan enheter.

   Grupp 1-6 har fasta platser (befattningar). Befattning och
   befattningsnummer hör till PLATSEN i gruppen, inte till personen -
   flyttar man en person byter personens uppgifter automatiskt till den
   nya platsens, och den gamla platsens uppgifter blir kvar och ledig.
   Grupp 7 (rekrytering) och grupp 8 (avveckling) är fria listor utan
   fasta platser.
   ========================================================================= */

/* ---------- constants ---------- */
const YEAR_START = 2026, YEAR_END = 2035;
function computeYears(){
  const end = (typeof DATA !== 'undefined' && DATA && DATA.yearEnd) ? Math.max(YEAR_END, DATA.yearEnd) : YEAR_END;
  return Array.from({length:end-YEAR_START+1}, (_,i)=>YEAR_START+i);
}
let YEARS = Array.from({length:YEAR_END-YEAR_START+1}, (_,i)=>YEAR_START+i);
const LS_REGISTRY = 'personalregister_registry';
const LS_PREFIX = 'personalregister_data:';
const LS_ACTIVE = 'personalregister_active';

const FIELD_DEFS = [
  {key:'befattning', label:'Befattning', front:true},
  {key:'namn', label:'Namn', front:true},
  {key:'anstallningsnummer', label:'Anställningsnummer', front:false},
  {key:'befattningsnummer', label:'Befattningsnummer', front:false},
  {key:'grad', label:'Grad', front:false},
  {key:'anstallningsar', label:'Anställningsår', front:false},
  {key:'telefonnummer', label:'Telefonnummer', front:true},
  {key:'telefon_arbete', label:'Telefon arbete', front:true},
  {key:'mejladress', label:'Mejladress', front:true},
  {key:'hemadress', label:'Hemadress', front:false},
  {key:'arbetsplats', label:'Arbetsplats', front:false},
  {key:'specialkost', label:'Specialkost', front:false, type:'select', options:['Glutenfritt','Laktosfritt','Vegetariskt']},
];
const FIELD_MAP = Object.fromEntries(FIELD_DEFS.map(f=>[f.key,f]));
const SLOT_FIELDS = ['befattning','befattningsnummer'];
/* Ny personal (rekrytering) and Avveckling are free-listed groups without
   fixed slots — befattning/befattningsnummer/grad don't apply there the
   way they do for the fixed-slot groups 1–6, so they're hidden from those
   two groups' tables (home cards and full group view). */
const FLEX_HIDDEN_FIELDS = ['befattning','befattningsnummer','grad'];

const DEFAULT_COMPETENCIES = [
  {id:'skyddsvakt', label:'SKYDDSVAKT', expiry:true, showInStats:true},
  {id:'forarbevis_pb8', label:'FÖRARBEVIS PB8', expiry:true, showInStats:true},
  {id:'forarbevis_bandvagn', label:'FÖRARBEVIS BANDVAGN', expiry:true, showInStats:true},
  {id:'forarbevis_lastbil', label:'FÖRARBEVIS LASTBIL', expiry:true, showInStats:true},
  {id:'forarbevis_tungtslap', label:'FÖRARBEVIS TUNGTSLÄP', expiry:true, showInStats:true},
  {id:'adr_13', label:'ADR 1.3', expiry:true, showInStats:true},
  {id:'tmm', label:'TMM', expiry:false, showInStats:true},
  {id:'rpas', label:'RPAS', expiry:false, showInStats:true},
  {id:'grg', label:'GRG', expiry:false, showInStats:true},
  {id:'ksp', label:'KSP', expiry:false, showInStats:true},
  {id:'sjukvard', label:'Sjukvård', expiry:false, showInStats:true},
  {id:'aktiv_instruktor', label:'Aktiv instruktör', expiry:false, showInStats:true},
  {id:'gu', label:'GU', expiry:false, showInStats:true},
  {id:'guf', label:'GUF', expiry:false, showInStats:true},
  {id:'grpc1', label:'GrpC1', expiry:false, showInStats:false},
  {id:'grpc2', label:'GrpC2', expiry:false, showInStats:false},
  {id:'grpc3', label:'GrpC3', expiry:false, showInStats:false},
  {id:'plutc1', label:'PlutC1', expiry:false, showInStats:false},
  {id:'plutc2', label:'PlutC2', expiry:false, showInStats:false},
  {id:'plutc3', label:'PlutC3', expiry:false, showInStats:false},
  {id:'ik1', label:'IK1', expiry:false, showInStats:false},
  {id:'ik2', label:'IK2', expiry:false, showInStats:false},
];

/* ---------- grade (grad) ladder ----------
   Ordered lowest (level 1) to highest (level 13). A person's current grade
   is the highest-level entry whose requirements are all met. Competency
   requirements are matched against DATA.competencies by normalized label,
   so the register owner adds e.g. "PlutC1"/"GrpC 1"/"IK1" as ordinary
   competencies (via "+ Lägg till egen kompetens") for this to take effect;
   "Aktiv instruktör", "GU" and "GUF" are pre-added default competencies. */
const GRADES = [
  {label:'Menig',        level:1,  bef:null, comps:['GUF'], minYears:null},
  /* Menig 1: GU, eller genomförd grundutbildning som blåbandare
     (8 avtalsövningar, noterad i notisrutan — se p.grundutbKlar). */
  {label:'Menig 1',      level:2,  bef:null, comps:['GU'], orGrundutb:true, minYears:null},
  {label:'Menig 2',      level:3,  bef:null, compsAny:['GU','GUF'], minYears:2},

/* one-time migration: moves "Förarbevis bandvagn" to sit directly after
   "Förarbevis PB8" in the competency list, for registers where it was
   appended at the end when the competency was first introduced. Guarded
   so a later manual reorder by the register owner isn't undone. */
function placeCompetencyAfter(list, id, afterId){
  const idx = list.findIndex(c=>c.id===id);
  const afterIdx = list.findIndex(c=>c.id===afterId);
  if(idx!==-1 && afterIdx!==-1 && idx!==afterIdx+1){
    const [item] = list.splice(idx,1);
    const newAfterIdx = list.findIndex(c=>c.id===afterId);
    list.splice(newAfterIdx+1,0,item);
  }
}
function ensureBandvagnOrder(data){
  if(data.bandvagnOrderApplied) return;
  placeCompetencyAfter(data.competencies, 'forarbevis_bandvagn', 'forarbevis_pb8');
  data.bandvagnOrderApplied = true;
}
/* one-time migration: moves "ADR 1.3" to sit directly after "Förarbevis
   tungtsläp" in the competency list, for registers where it was appended
   at the end when the competency was first introduced. */
function ensureAdr13Order(data){
  if(data.adr13OrderApplied) return;
  placeCompetencyAfter(data.competencies, 'adr_13', 'forarbevis_tungtslap');
  data.adr13OrderApplied = true;
}
function ensureNamePosition(data){
  const order = data.columnOrder;
  const befIdx = order.indexOf('befattning');
  const namnIdx = order.indexOf('namn');
  if(befIdx===-1 || namnIdx===-1) return;
  if(namnIdx!==befIdx+1){
    order.splice(namnIdx,1);
    const newBefIdx = order.indexOf('befattning');
    order.splice(newBefIdx+1,0,'namn');
  }
}
/* adds any FIELD_DEFS key missing from a loaded register's columnOrder

/* one-time migration: renames the befattningar for grupp 1-5 to the new
   scheme (PlutC/Stf PlutC/Signalist/Signalist/Soldat/Hundförare/Hundförare
   for grupp 1; GrpC/Stf GrpC + sju Soldat för grupp 2-5) and grows grupp
   2-5 from åtta till nio platser. Existing people keep their plats
   (slotIndex) and befattningsnummer - bara befattningstexten byts, och en
   ny tom plats läggs till sist i grupp 2-5. Guarded so a later manual
   rename isn't overwritten again. */
function ensureBefattningarV2(data){
  if(data.befattningarV2Applied) return;
  const NEW_BEF = {
    g1: ['PlutC','Stf PlutC','Signalist','Signalist','Soldat','Hundförare','Hundförare'],
    g2: ['GrpC','Stf GrpC','Soldat','Soldat','Soldat','Soldat','Soldat','Soldat','Soldat'],
    g3: ['GrpC','Stf GrpC','Soldat','Soldat','Soldat','Soldat','Soldat','Soldat','Soldat'],
    g4: ['GrpC','Stf GrpC','Soldat','Soldat','Soldat','Soldat','Soldat','Soldat','Soldat'],
    g5: ['GrpC','Stf GrpC','Soldat','Soldat','Soldat','Soldat','Soldat','Soldat','Soldat'],
  };
  Object.keys(NEW_BEF).forEach(gid=>{
    const g = data.groups.find(x=>x.id===gid);
    if(!g || !g.slots) return;
    const labels = NEW_BEF[gid];
    while(g.slots.length < labels.length){
      g.slots.push({befattning:'', befattningsnummer:''});
    }
    labels.forEach((lab,i)=>{ g.slots[i].befattning = lab; });
  });
  data.befattningarV2Applied = true;
}

function ensurePersonShape(p){
  FIELD_DEFS.forEach(f=>{ if(p[f.key]===undefined) p[f.key]=''; });
  if(!p.namn && (p.fornamn || p.efternamn)){
    p.namn = `${p.fornamn||''} ${p.efternamn||''}`.trim();
  }
  delete p.fornamn; delete p.efternamn;
  if(p.sortIndex===undefined) p.sortIndex = 0;
  if(p.slotIndex===undefined) p.slotIndex = null;
  if(!p.kompetenser) p.kompetenser={};
  DATA.competencies.forEach(c=>{ if(!p.kompetenser[c.id]) p.kompetenser[c.id]={has:false,utgangsdatum:''}; });
  if(!p.ovningar) p.ovningar={};
  YEARS.forEach(y=>{
    if(!p.ovningar[y]) p.ovningar[y]={};
    EXERCISE_TYPES.forEach(t=>{
      const cur = p.ovningar[y][t.key];
      if(cur===undefined){ p.ovningar[y][t.key] = {status:null, anledning:''}; }
      else if(typeof cur === 'boolean'){ p.ovningar[y][t.key] = {status: cur?'narvarande':null, anledning:''}; }
      else { if(cur.status===undefined) cur.status=null; if(cur.anledning===undefined) cur.anledning=''; }
    });
  });
  if(!p.utvecklingsplan) p.utvecklingsplan={};
  YEARS.forEach(y=>{ if(p.utvecklingsplan[y]===undefined) p.utvecklingsplan[y]=''; });
  if(!p.rekrytering) p.rekrytering = {steg:'intresseanmalan', datum:{kontaktad:'', intervju:''}};
  if(!p.rekrytering.datum) p.rekrytering.datum = {kontaktad:'', intervju:''};
  if(p.avtalsarInnanStart===undefined) p.avtalsarInnanStart = 0;
  if(p.plutcSedanAr===undefined) p.plutcSedanAr = '';
  if(p.underUtbildning===undefined) p.underUtbildning = false;
  if(p.grundutbKlar===undefined) p.grundutbKlar = false;
  return p;
}

/* one-time migration: place existing free-listed persons in newly-fixed
   standard groups into vacant slots, in their previous order */
function migrateFreeformToSlots(){
  DATA.groups.filter(g=>g.kind==='standard').forEach(g=>{
    const inGroup = DATA.persons.filter(p=>p.groupId===g.id);
    const validPlaced = inGroup.filter(p=>p.slotIndex!=null && p.slotIndex>=0 && p.slotIndex<g.slots.length);
    const seen = new Set();
    validPlaced.forEach(p=>{
      if(seen.has(p.slotIndex)) p.slotIndex = null; else seen.add(p.slotIndex);
    });
    const unplaced = inGroup.filter(p=>!(p.slotIndex!=null && p.slotIndex>=0 && p.slotIndex<g.slots.length && seen.has(p.slotIndex)))
      .sort((a,b)=>(a.sortIndex||0)-(b.sortIndex||0));
    let next = 0;
    unplaced.forEach(p=>{
      while(next<g.slots.length && seen.has(next)) next++;
      if(next<g.slots.length){ p.slotIndex = next; seen.add(next); next++; }
    });
  });
}

function sanitizeFileBase(name){
  let base = (name||'').trim().replace(/[\\/:*?"<>|]/g,'').replace(/\.+$/,'').trim();
  return base || 'Register';
}
function hydrateData(parsed){
  if(!parsed.groups || !parsed.groups.length){ parsed.groups = DEFAULT_GROUPS.map(clone); }
  ensureGroups(parsed);
  ensureReserveGroup(parsed);
  ensureBefattningarV2(parsed);
  if(!parsed.columnOrder){ parsed.columnOrder = FIELD_DEFS.map(f=>f.key); }
  ensureNamePosition(parsed);
  ensureColumnOrderComplete(parsed);
  if(!parsed.competencies || !parsed.competencies.length){ parsed.competencies = DEFAULT_COMPETENCIES.map(c=>({...c})); }
  ensureDefaultCompetencies(parsed);
  ensureBandvagnOrder(parsed);
  ensureAdr13Order(parsed);
  ensureCompetencyStatsFlags(parsed.competencies);
  if(!parsed.mal) parsed.mal = {};
  ensureNotiser(parsed);
  if(parsed.kompani===undefined) parsed.kompani = '';
  if(parsed.pluton===undefined) parsed.pluton = '';
  DATA = parsed;
  YEARS = computeYears();
  DATA.persons = (DATA.persons||[]).map(ensurePersonShape);
  migrateFreeformToSlots();
  return DATA;
}

function lsLoadRegistry(){
  try{ return JSON.parse(localStorage.getItem(LS_REGISTRY)) || []; }catch(e){ return []; }
}
function lsSaveRegistry(list){
  try{ localStorage.setItem(LS_REGISTRY, JSON.stringify(list)); }catch(e){}

function uniqueLsKey(base){
  const list = lsLoadRegistry();
  let key = base, n = 2;
  while(list.some(r=>r.key===key)){ key = base+' ('+n+')'; n++; }
  return key;
}
async function loadLocalRegister(key){
  const raw = localStorage.getItem(LS_PREFIX+key);
  if(!raw){
    const list = lsLoadRegistry().filter(r=>r.key!==key);
    lsSaveRegistry(list);
    DATA = null; currentFileName = null; registerList = list;
    view = {name:'setup'}; renderAll(); return;
  }
  let text;
  try{ text = await decryptFromStorage(raw); }
  catch(e){ alert('Registret kunde inte låsas upp: '+(e.message||e)); return; }
  try{
    hydrateData(JSON.parse(text));
    currentFileName = key;
    registerList = lsLoadRegistry();
    localStorage.setItem(LS_ACTIVE, key);
    if(!isEncryptedPayload(raw)) saveToDisk(); // gammalt okrypterat register krypteras direkt
    view = {name:'home'};
    renderAll();
  }catch(e){ alert('Registret kunde inte läsas.'); }
}
function createLocalRegister(name){
  const label = sanitizeFileBase(name);
  const key = uniqueLsKey(label);
  DATA = defaultData();
  DATA.title = label;
  currentFileName = key;
  const list = lsLoadRegistry();
  list.push({key, label:key});
  lsSaveRegistry(list);
  registerList = list;
  saveToDisk();
  view = {name:'home'};
  renderAll();
}

let saving = false;
/* Sparningar körs en i taget (krypteringen är asynkron) så att en äldre
   version aldrig kan skriva över en nyare. Varje sparning tar det
   aktuella registret vid den tidpunkt den faktiskt körs. */
let saveChain = Promise.resolve();
let savePending = false;
let saveFailedWarned = false;
function saveToDisk(){
  if(!DATA || !currentFileName) return saveChain;
  if(savePending) return saveChain;
  savePending = true;
  saving = true; updateStatus();
  const target = {data: DATA, file: currentFileName};
  saveChain = saveChain.then(async ()=>{
    savePending = false;
    const data = (DATA && currentFileName===target.file) ? DATA : target.data;
    if(!data || !vaultKey) return;
    try{
      const payload = await encryptForStorage(JSON.stringify(data));
      localStorage.setItem(LS_PREFIX+target.file, payload);
      localStorage.setItem(LS_ACTIVE, target.file);
      saveFailedWarned = false;
    }catch(e){
      console.error('Kunde inte spara:', e);
      if(!saveFailedWarned){
        saveFailedWarned = true;
        alert('VARNING: Ändringen kunde inte sparas i appen ('+(e.message||e)+'). Gör en säkerhetskopia (Exportera JSON) direkt så att inget går förlorat.');
      }
    }
  }).finally(()=>{ saving = false; updateStatus(); });
  return saveChain;
}

function updateStatus(){
  const s = document.getElementById('saveStatus');
  if(s) s.textContent = saving ? 'Sparar…' : 'Sparat';
}

/* Lämnar ut en fil: på telefon/surfplatta via dela-menyn (spara i Filer,
   mejla, skicka i Slack …) när det stöds, annars som vanlig nedladdning. */
function isTouchDevice(){ return window.matchMedia && matchMedia('(pointer:coarse)').matches; }
async function deliverFile(blob, filename){
  try{
    if(isTouchDevice() && navigator.canShare){
      const file = new File([blob], filename, {type: blob.type || 'application/octet-stream'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: filename});
        return true;
      }
    }
  }catch(e){
    if(e && e.name==='AbortError') return false; // användaren stängde dela-menyn
    /* annars: fall tillbaka till nedladdning */
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  return true;
}

async function exportJson(){
  if(!DATA) return;
  /* säkerhetskopian krypteras med din PIN-kod — den kan bara läsas in
     igen i appen, med samma PIN-kod */
  const payload = await encryptForStorage(JSON.stringify(DATA));
  const blob = new Blob([payload], {type:'application/json'});
  const ok = await deliverFile(blob, sanitizeFileBase(DATA.title||currentRegisterLabel()||'personalregister') + '.json');
  if(ok){
    try{ localStorage.setItem(LS_BACKUP_PREFIX+currentFileName, String(Date.now())); }catch(e){}
    if(view.name==='home') renderAll();
  }
}

/* ---------- exporting a group / the whole register (CSV file or Slack-friendly text) ---------- */
function csvEscape(val){
  const s = String(val==null?'':val);
  if(/["\;\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function buildCsv(headerRow, dataRows){
  const lines = [headerRow].concat(dataRows).map(r=>r.map(csvEscape).join(';'));
  return '\uFEFF' + lines.join('\r\n');
}
function downloadTextFile(filename, content, mime){
  const blob = new Blob([content], {type: mime||'text/plain;charset=utf-8'});
  deliverFile(blob, filename);
}
function slugify(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'grupp';
}
function groupPersonRows(gid){
  const g = getGroup(gid);
  if(!g) return [];
  if(g.kind==='standard') return standardGroupRows(gid).filter(r=>r.person).map(r=>r.person);
  return personsInGroup(gid);
}
function fullPersonHeader(){
  const header = FIELD_DEFS.map(c=>c.label);
  header.push('Grundutbildning');
  DATA.competencies.forEach(c=>header.push(c.label));
  YEARS.forEach(y=>header.push('Avtalsuppfyllnad '+y));
  YEARS.forEach(y=>header.push('Utvecklingsplan '+y));
  return header;
}
function personRowValues(p){
  const row = FIELD_DEFS.map(c=>{
    if(c.key==='befattning') return personBefattningDisplay(p);
    if(c.key==='befattningsnummer') return personBefattningsnummer(p);
    return p[c.key];
  });
  row.push(p.underUtbildning
    ? `Under utbildning (${Math.min(exerciseCount(p),GRUNDUTB_KRAV)}/${GRUNDUTB_KRAV})`
    : (p.grundutbKlar ? 'Klar' : ''));
  DATA.competencies.forEach(c=>{
    const k = p.kompetenser && p.kompetenser[c.id];
    if(!k || !k.has){ row.push(''); return; }
    row.push((c.expiry && k.utgangsdatum) ? `Ja (t.o.m. ${k.utgangsdatum})` : 'Ja');
  });
  YEARS.forEach(y=>{
    const yr = p.ovningar && p.ovningar[y];
    const ok = !!(yr && EXERCISE_TYPES.every(t=>yr[t.key] && yr[t.key].status==='narvarande'));
    row.push(ok ? 'Ja' : 'Nej');
  });
  YEARS.forEach(y=>{
    row.push((p.utvecklingsplan && p.utvecklingsplan[y]) || '');
  });
  return row;
}
/* Gruppexport: för "Ny personal" exporteras endast markerad personal. */
function exportPersonsForGroup(gid){
  const g = getGroup(gid);
  const people = groupPersonRows(gid);
  if(g && g.kind==='recruit') return people.filter(p=>selectedPersons.has(p.id));
  return people;
}
function exportGroupCsv(gid){

  const rows = exportPersonsForGroup(gid).map(p=>{
    const row = personRowValues(p);
    if(g.kind==='recruit') row.push(recruitStepText(p));
    return row;
  });
  downloadTextFile(slugify(g.name)+'-personal.csv', buildCsv(header, rows), 'text/csv;charset=utf-8');
}
function exportAllCsv(){

  const rows = [];
  DATA.groups.forEach(g=>{
    groupPersonRows(g.id).forEach(p=>{
      rows.push([g.name].concat(personRowValues(p)));
    });
  });
  downloadTextFile('personalregister-alla-grupper.csv', buildCsv(header, rows), 'text/csv;charset=utf-8');
}
function personSlackFieldsLine(p){
  const parts = FIELD_DEFS.filter(f=>f.key!=='namn' && f.key!=='befattning').map(f=>{
    const val = (f.key==='befattningsnummer') ? personBefattningsnummer(p) : p[f.key];
    return val ? `${f.label}: ${val}` : null;
  }).filter(Boolean);
  return parts.length ? '   '+parts.join(' · ') : '';
}
function ovningStatusText(st){
  if(!st || !st.status) return 'Ej satt';
  if(st.status==='franvarande') return st.anledning ? `Frånvarande (${st.anledning})` : 'Frånvarande';
  return 'Närvarande';
}
function personSlackDetailLines(p){
  const lines = [];
  if(p.underUtbildning) lines.push(`   Under utbildning: Ja (${Math.min(exerciseCount(p),GRUNDUTB_KRAV)}/${GRUNDUTB_KRAV} avtalsövningar)`);
  else if(p.grundutbKlar) lines.push(`   Grundutbildning: Klar`);
  lines.push(`   Avtalsår innan ${YEAR_START}: ${p.avtalsarInnanStart||0}`);
  if(p.plutcSedanAr!==undefined && p.plutcSedanAr!==''){
    lines.push(`   Stf PlutC/PlutC sedan år: ${p.plutcSedanAr}`);
  }

  const compsHave = DATA.competencies.filter(c=>p.kompetenser && p.kompetenser[c.id] && p.kompetenser[c.id].has)
    .map(c=>{
      const k = p.kompetenser[c.id];
      return (c.expiry && k.utgangsdatum) ? `${c.label} (t.o.m. ${k.utgangsdatum})` : c.label;
    });
  lines.push('   Kompetenser: '+(compsHave.length ? compsHave.join(', ') : '–'));

  /* One line per year, only for years with at least one recorded status —
     years nobody has touched yet are left out entirely so a round-trip
     import never turns an untouched year into an explicit "frånvarande". */
  YEARS.forEach(y=>{
    const yr = p.ovningar && p.ovningar[y];
    if(!yr) return;
    const anySet = EXERCISE_TYPES.some(t=>yr[t.key] && yr[t.key].status);
    if(!anySet) return;
    const parts = EXERCISE_TYPES.map(t=>`${t.label} ${ovningStatusText(yr[t.key])}`);
    lines.push(`   Avtalsövningar ${y}: ${parts.join(', ')}`);
  });

  const plans = YEARS.map(y=>{
    const txt = (p.utvecklingsplan && p.utvecklingsplan[y]) || '';
    return txt ? `   Utvecklingsplan ${y}: ${txt}` : null;
  }).filter(Boolean);
  lines.push(...plans);

  return lines;
}
function groupSlackText(gid, onlySelected){
  const g = getGroup(gid);
  if(!g) return '';
  const people = onlySelected ? exportPersonsForGroup(gid) : groupPersonRows(gid);
  const lines = ['*'+g.name+'*', ''];
  if(!people.length){ lines.push('_Ingen personal registrerad_'); }
  people.forEach(p=>{
    const bef = personBefattningDisplay(p);
    lines.push('• *'+fullName(p)+'*'+(bef ? ' — '+bef : ''));
    const fieldsLine = personSlackFieldsLine(p);
    if(fieldsLine) lines.push(fieldsLine);
    lines.push(...personSlackDetailLines(p));
    lines.push('');
  });
  return lines.join('\n').trim();
}
function allGroupsSlackText(){

}

/* ---------- import updates from a pasted Slack text export ----------
   Lets a gruppchef paste back an edited copy of the text produced by
   groupSlackText() (see above) to bulk-update the group's existing
   personal. Persons are matched by name against the group's current
   roster. Names that don't match are treated as new personnel and
   placed on a vacant slot (or added as a new row in a free-listed
   group).

   Block-splitting does NOT rely on bullet characters ("•"), since
   copying text out of the real Slack app (rather than pasting our own
   export straight back) can easily lose or change list-bullet
   formatting. Instead, any line that isn't recognisable as one of our
   own "Label: value" detail lines is treated as the start of a new
   person. */
const SLACK_DETAIL_LABEL_RE = /^(Under utbildning|Grundutbildning|Kompetenser|Avtalsövningar\s+\d{4}|Utvecklingsplan\s+\d{4}|Avtalsår innan\s+\d{4}|Stf PlutC\/PlutC sedan år)\s*:/i;
function slackFieldPairs(line){
  /* Matches "Label: value" runs without depending on a specific
     separator character between them (Slack round-trips can turn our
     " · " separator into a different character, extra spaces, etc). A
     new pair starts wherever the next recognised field label appears. */
  const labelAlt = FIELD_DEFS.map(f=>f.label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  const re = new RegExp('(^|[·•|,;]\\s*)('+labelAlt+')\\s*:\\s*([^·•|]*?)(?=\\s*[·•|,;]?\\s*(?:'+labelAlt+')\\s*:|$)', 'gi');
  const pairs = [];
  let m;
  while((m = re.exec(line))){
    pairs.push([m[2].trim(), m[3].trim()]);
  }
  return pairs;
}
function isSlackDetailLine(line){
  if(SLACK_DETAIL_LABEL_RE.test(line)) return true;
  return slackFieldPairs(line).length>0;
}
function openSlackImportModal(gid){
  const g = getGroup(gid);
  if(!g) return;
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:640px;">
    <h3>Importera från Slack — ${esc(g.name)}</h3>
    <p style="color:var(--ink-soft);font-size:13px;margin-bottom:10px;">Klistra in texten från "Exportera → Krypterad text" (krypterad text låses upp med delningskoden), eller välj den som .txt-fil. Personer matchas mot befintlig personal i gruppen via namn och uppdateras. Namn som inte hittas i gruppen tolkas som ny personal och skrivs in på en ledig (tom) plats i gruppen — eller läggs till som en ny rad om gruppen är en fri lista.</p>
    <p style="color:var(--ink-faint);font-size:11px;margin-bottom:14px;">Avtalsövningar (SÖF/KFÖ) och utvecklingsplan skrivs år för år och uppdaterar bara de år som faktiskt står med i texten — år utan rad rörs inte alls. Kompetenser-raden ersätter hela personens kompetenslista, men om raden helt saknas i texten lämnas kompetenserna orörda.</p>
    <div class="field full">
      <input type="file" accept=".txt,text/plain" style="margin-bottom:8px;" onchange="(f=>{ if(!f) return; const r=new FileReader(); r.onload=()=>{ document.getElementById('slackImportText').value=r.result; }; r.readAsText(f,'UTF-8'); })(this.files[0])">
      <textarea id="slackImportText" rows="14" style="width:100%;font-family:monospace;font-size:12px;border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px;box-sizing:border-box;" placeholder="Klistra in texten här…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Avbryt</button>
      <button class="btn primary" onclick="confirmSlackImport('${gid}')">Uppdatera grupp</button>
    </div>
  </div>`;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  document.body.appendChild(overlay);

}
/* Splits pasted text into one block per person using BLANK LINES as the
   boundary (our export always puts a blank line between people, and
   blank lines tend to survive copy/paste out of real chat apps even
   when bold/bullet formatting and word-wrapping don't). Within a
   paragraph, the first line is the person's header (name); any further
   line that matches one of our recognised "Label: value" detail
   patterns is kept as its own detail line, and anything else (e.g. a
   long detail line that got hard-wrapped onto a second physical line
   by the chat client) is merged onto the previous line instead of
   being mistaken for a new person. */
function parseSlackBlocks(text){
  const norm = text.normalize('NFC').replace(/\u00A0/g,' ');
  const paragraphs = norm.replace(/\r\n/g,'\n').split(/\n\s*\n+/);
  const blocks = [];
  paragraphs.forEach(para=>{
    const rawLines = para.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!rawLines.length) return;
    let header = rawLines[0];
    const lines = [];
    for(let i=1;i<rawLines.length;i++){
      const line = rawLines[i];
      if(isSlackDetailLine(line)){
        lines.push(line);
      } else if(lines.length){
        lines[lines.length-1] += ' ' + line;
      } else {
        header += ' ' + line;
      }
    }
    blocks.push({header, lines});
  });
  return blocks;
}
function extractSlackName(headerLine){
  const s0 = headerLine.trim();
  /* Check for bold *Name* on the UNMODIFIED line first — stripping a
     leading bullet/asterisk before this check would destroy the pairing
     for a line that's bold-wrapped with no separate bullet character
     (e.g. the group's own "*Gruppnamn*" heading), leaving one stray "*"
     that then got kept as part of the "name". */
  const boldMatch = s0.match(/\*([^*]+)\*/);
  if(boldMatch) return boldMatch[1].trim();
  const s = s0.replace(/^[•\-*]+\s*/, '').trim();
  const dashIdx = s.indexOf(' — ');
  return (dashIdx!==-1 ? s.slice(0, dashIdx) : s).trim();
}
function applySlackFieldsLine(p, g, line, skipBefNr){
  slackFieldPairs(line).forEach(([label, value])=>{
    const f = FIELD_DEFS.find(fd=>fd.label.toLowerCase()===label.toLowerCase());
    if(!f) return;
    if(f.key==='befattningsnummer' && skipBefNr) return;
    if(f.key==='befattningsnummer' && g.kind==='standard' && p.slotIndex!=null && g.slots[p.slotIndex]){
      g.slots[p.slotIndex].befattningsnummer = value;
    } else {
      p[f.key] = value;
    }
  });
}
function applySlackCompetencies(p, line){
  const listPart = line.replace(/^Kompetenser:\s*/i, '').trim();
  DATA.competencies.forEach(c=>{ if(p.kompetenser[c.id]) p.kompetenser[c.id].has = false; });
  if(!listPart || listPart==='–' || listPart==='-') return;
  listPart.split(',').map(s=>s.trim()).filter(Boolean).forEach(entry=>{
    const m = entry.match(/^(.*?)(?:\s*\(t\.o\.m\.\s*([\d-]+)\))?$/);
    const label = (m ? m[1] : entry).trim().toLowerCase();
    const expiry = m && m[2] ? m[2] : '';
    const comp = DATA.competencies.find(c=>c.label.toLowerCase()===label);
    if(!comp) return;
    p.kompetenser[comp.id].has = true;
    if(expiry) p.kompetenser[comp.id].utgangsdatum = expiry;
  });
}
function applySlackAvtalOvning(p, line){
  const m = line.match(/^Avtalsövningar\s+(\d{4}):\s*(.*)$/i);
  if(!m) return;
  const year = Number(m[1]);
  if(!p.ovningar[year]) return;
  m[2].split(',').map(s=>s.trim()).filter(Boolean).forEach(entry=>{
    const t = EXERCISE_TYPES.find(t=>entry.toUpperCase().startsWith(t.label.toUpperCase()+' '));
    if(!t) return;
    let rest = entry.slice(t.label.length).trim();
    let reason = '';
    const reasonMatch = rest.match(/^Frånvarande\s*\(([^)]*)\)$/i);
    if(reasonMatch){ rest = 'Frånvarande'; reason = reasonMatch[1]; }
    let status;
    if(/^Närvarande$/i.test(rest)) status = 'narvarande';
    else if(/^Frånvarande$/i.test(rest)) status = 'franvarande';
    else status = null; // "Ej satt" eller okänt värde -> lämna som obesvarat
    p.ovningar[year][t.key].status = status;
    p.ovningar[year][t.key].anledning = (status==='franvarande') ? reason : '';
  });
}
function applySlackPlan(p, line){
  const m = line.match(/^Utvecklingsplan\s+(\d{4}):\s*(.*)$/i);
  if(!m) return;
  const year = Number(m[1]);
  if(p.utvecklingsplan[year]===undefined) return;
  p.utvecklingsplan[year] = m[2].trim();
}
function applySlackYearsBefore(p, line){
  const m = line.match(/^Avtalsår innan\s+\d{4}:\s*(-?\d+)/i);
  if(!m) return;
  p.avtalsarInnanStart = Math.max(0, parseInt(m[1],10)||0);
}
function applySlackTraining(p, line){
  if(/^Under utbildning:\s*Ja/i.test(line)){ p.underUtbildning = true; p.grundutbKlar = false; p.grad = 'Menig'; }
  else if(/^Under utbildning:\s*Nej/i.test(line)){ p.underUtbildning = false; }
  else if(/^Grundutbildning:\s*Klar/i.test(line)){ p.underUtbildning = false; p.grundutbKlar = true; }
}
function applySlackPlutcSedanAr(p, line){
  const m = line.match(/^Stf PlutC\/PlutC sedan år:\s*(-?\d+)/i);
  if(!m) return;
  p.plutcSedanAr = parseInt(m[1],10);
}
function applySlackLines(p, g, lines, skipBefNr){
  lines.forEach(line=>{
    if(/^(Under utbildning|Grundutbildning):/i.test(line)) applySlackTraining(p, line);
    else if(/^Kompetenser:/i.test(line)) applySlackCompetencies(p, line);
    else if(/^Avtalsövningar\s+\d{4}:/i.test(line)) applySlackAvtalOvning(p, line);
    else if(/^Utvecklingsplan\s+\d{4}:/i.test(line)) applySlackPlan(p, line);
    else if(/^Avtalsår innan\s+\d{4}:/i.test(line)) applySlackYearsBefore(p, line);
    else if(/^Stf PlutC\/PlutC sedan år:/i.test(line)) applySlackPlutcSedanAr(p, line);
    else applySlackFieldsLine(p, g, line, skipBefNr);
  });
}
/* Befattningsnummer som står i en persons fältrad i Slack-texten */
function slackBlockBefNr(block){
  for(const line of block.lines){
    if(SLACK_DETAIL_LABEL_RE.test(line)) continue;
    const pair = slackFieldPairs(line).find(([l])=>l.toLowerCase()==='befattningsnummer');
    if(pair) return String(pair[1]||'').trim();
  }
  return '';
}

/* ---------- import av HELA plutonen från text ("Exportera allt" ->
   "Kopiera som text"). Texten delas upp per grupp via gruppernas
   rubrikrader (*Gruppnamn*). Personer matchas via namn mot hela
   registret: finns personen redan uppdateras hen (och flyttas om hen
   står under en annan grupp i texten), annars läggs hen till. Personer
   som finns i registret men saknas i texten tas INTE bort — de listas
   i sammanfattningen så att du själv kan avgöra. ---------- */
async function importFullFromTextarea(){
  let text;
  try{ text = await openSharedText(document.getElementById('impText').value); }
  catch(e){ if(e && e.message!=='avbrutet') alert('Texten kunde inte låsas upp: '+(e.message||e)); return; }
  if(text==null) return;
  confirmFullSlackImport(text);
}
function confirmFullSlackImport(text){
  if(/^Avtalsuppfyllnad:/im.test(text)){
    alert('Den inklistrade texten verkar vara kopierad i ett äldre format (innehåller "Avtalsuppfyllnad:"). Exportera en ny kopia från den här versionen av registret och klistra in den istället.');
    return;
  }
  const allBlocks = parseSlackBlocks(text);
  const groupByName = new Map(DATA.groups.map(g=>[g.name.trim().toLowerCase(), g]));
  const entries = [];
  const unknownGroups = [];
  const skippedNoGroup = [];
  let cur = null, sawHeader = false;
  allBlocks.forEach(block=>{
    if(!block.lines.length){
      const hdr = extractSlackName(block.header);
      if(/^_?Ingen personal registrerad_?$/i.test(hdr)) return;
      const g = groupByName.get(hdr.trim().toLowerCase());
      if(g){ cur = g; sawHeader = true; }
      else if(/^\s*\*[^*]+\*\s*$/.test(block.header)){ cur = null; sawHeader = true; unknownGroups.push(hdr); }
      return;
    }
    const name = extractSlackName(block.header);
    if(!name) return;
    if(!cur){ skippedNoGroup.push(name); return; }
    entries.push({name, g:cur, block, nr:slackBlockBefNr(block)});
  });
  if(!sawHeader || (!entries.length && !skippedNoGroup.length)){
    alert('Hittade inga grupprubriker med personal i texten. Använd "Exportera allt" → "Kopiera som text" på den andra enheten och klistra in hela texten.');
    return;
  }
  const byName = new Map();
  DATA.persons.forEach(p=>{ const k = fullName(p).trim().toLowerCase(); if(!byName.has(k)) byName.set(k, p); });

  const updated=[], added=[], moved=[], overflow=[];
  const needSlot = [];
  const seen = new Set();
  /* steg 1: koppla loss personer som byter grupp så att deras gamla plats blir ledig */
  entries.forEach(e=>{
    let p = byName.get(e.name.trim().toLowerCase());
    if(p && seen.has(p.id)) p = null; // samma namn två gånger -> behandla som ny
    if(p){
      seen.add(p.id);
      e.p = p;
      if(p.groupId!==e.g.id){
        const oldG = getGroup(p.groupId);
        if(oldG && oldG.kind==='standard' && p.slotIndex!=null && oldG.slots[p.slotIndex]){
          p.befattning = oldG.slots[p.slotIndex].befattning;
          p.befattningsnummer = oldG.slots[p.slotIndex].befattningsnummer;
        }
        p.groupId = e.g.id;
        p.slotIndex = null;
        p.sortIndex = nextSortIndex();
        e.moved = true;
        if(e.g.kind==='standard') needSlot.push(e);
      }
    } else {
      p = emptyPerson(e.g.id);
      p.namn = e.name;
      DATA.persons.push(p);
      seen.add(p.id);
      e.p = p; e.isNew = true;
      if(e.g.kind==='standard') needSlot.push(e);
    }
  });
  /* steg 2: placera flyttade/nya i fasta grupper — i första hand på raden
     med samma befattningsnummer, annars första lediga rad */
  needSlot.forEach(e=>{
    const g = e.g;
    const taken = idx=>DATA.persons.some(x=>x.groupId===g.id && x.slotIndex===idx);
    let idx = -1;
    if(e.nr){
      const m = g.slots.findIndex(sl=>String(sl.befattningsnummer||'').trim().toLowerCase()===e.nr.toLowerCase());
      if(m>=0 && !taken(m)) idx = m;
    }
    if(idx<0){ idx = firstVacantSlot(g.id); e.skipNr = true; }
    if(idx<0){ overflow.push(e.name+' ('+g.name+')'); e.p.slotIndex = null; }
    else e.p.slotIndex = idx;
  });
  /* steg 3: skriv in uppgifterna */
  entries.forEach(e=>{
    applySlackLines(e.p, e.g, e.block.lines, e.skipNr);
    if(e.isNew) added.push(e.name);
    else if(e.moved){ moved.push(e.name+' → '+e.g.name); updated.push(e.name); }
    else updated.push(e.name);
  });
  const missing = DATA.persons.filter(p=>!seen.has(p.id)).map(p=>fullName(p)+' ('+groupName(p.groupId)+')');

  closeModal();
  saveToDisk();
  view = {name:'home'};
  renderAll();
  const lines = [];
  lines.push(`${updated.length} person${updated.length===1?'':'er'} uppdaterade, ${added.length} ny${added.length===1?'':'a'} tillagd${added.length===1?'':'a'}.`);
  if(added.length) lines.push('\nNya: '+added.join(', '));
  if(moved.length) lines.push('\nFlyttade mellan grupper:\n  '+moved.join('\n  '));
  if(overflow.length) lines.push('\nIngen ledig rad — ligger "utan fast plats" i gruppen:\n  '+overflow.join('\n  '));
  if(unknownGroups.length) lines.push('\nOkända grupprubriker (personal under dessa hoppades över): '+unknownGroups.join(', '));
  if(skippedNoGroup.length) lines.push('\nHoppades över (ingen grupp angiven): '+skippedNoGroup.join(', '));
  if(missing.length) lines.push('\nFinns i registret men saknas i texten (har INTE tagits bort):\n  '+missing.slice(0,25).join('\n  ')+(missing.length>25?'\n  … och '+(missing.length-25)+' till':''));
  alert(lines.join('\n'));
}

async function confirmSlackImport(gid){
  let text;
  try{ text = await openSharedText(document.getElementById('slackImportText').value); }
  catch(e){ if(e && e.message!=='avbrutet') alert('Texten kunde inte låsas upp: '+(e.message||e)); return; }
  if(text==null) return;
  confirmSlackImportText(gid, text);
}
function confirmSlackImportText(gid, text){
  const g = getGroup(gid);
  if(!g) return;
  if(/^Avtalsuppfyllnad:/im.test(text)){
    alert('Den inklistrade texten verkar vara kopierad i ett äldre format (innehåller "Avtalsuppfyllnad:"). Exportera en ny kopia av gruppen från den här versionen av registret ("Kopiera som text") och klistra in den istället.');
    return;
  }
  /* drops any block with no detail lines at all — a real exported person
     always has at least "Avtalsår innan …" and "Kompetenser: …", so a
     header with nothing under it is stray text (the group's own
     "*Gruppnamn*" heading, a chat timestamp/sender line that tagged
     along in the paste, etc.), never an actual person to add. */
  const blocks = parseSlackBlocks(text).filter(b=>b.lines.length>0);
  if(!blocks.length){ alert('Hittade inga personposter i texten. Kontrollera att den är kopierad från "Kopiera som text".'); return; }
  const people = groupPersonRows(gid);
  const byName = new Map(people.map(p=>[fullName(p).trim().toLowerCase(), p]));
  const updated = [];
  const added = [];
  const noRoom = [];
  blocks.forEach(block=>{
    const name = extractSlackName(block.header);
    if(!name) return;
    let p = byName.get(name.trim().toLowerCase());
    let isNew = false;
    if(!p){
      /* ny personal som inte finns i gruppen sedan tidigare — placeras på
         första lediga (tomma) platsen för fasta grupper, eller läggs till
         som ny rad i fria listor (rekrytering/avveckling) */
      if(g.kind==='standard'){
        const vacant = firstVacantSlot(gid);
        if(vacant<0){ noRoom.push(name); return; }
        p = emptyPerson(gid);
        p.slotIndex = vacant;
      } else {
        p = emptyPerson(gid);
      }
      p.namn = name;
      isNew = true;
    }
    applySlackLines(p, g, block.lines);
    if(isNew){ DATA.persons.push(p); added.push(name); }
    else updated.push(name);
  });
  closeModal();
  saveToDisk();
  renderAll();
  const parts = [];
  if(updated.length) parts.push(`${updated.length} person${updated.length===1?'':'er'} uppdaterade`);
  if(added.length) parts.push(`${added.length} ny${added.length===1?'':'a'} person${added.length===1?'':'er'} tillagd${added.length===1?'':'a'} (${added.join(', ')})`);
  let msg = parts.length ? parts.join(' och ')+` i "${g.name}".` : 'Inga ändringar gjordes.';
  if(noRoom.length) msg += `\n\nIngen ledig plats kvar för: ${noRoom.join(', ')} — lägg till fler platser i gruppen eller ta bort dem ur texten.`;
  alert(msg);
}

/* ---------- personnel report (Excel, from mall_personalrapport /
   mall_övningsanmälan) — shared helpers ---------- */
/* Ordered list of currently selected persons, in the same order they
   appear on the home view (group order, then row/slot order within
   standard groups, then sortIndex within flexible groups). */
function selectedPersonsInHomeOrder(){
  const out = [];
  DATA.groups.forEach(g=>{
    if(g.kind==='standard'){
      standardGroupRows(g.id).forEach(row=>{
        if(row.person && selectedPersons.has(row.person.id)) out.push(row.person);
      });
    } else {
      personsInGroup(g.id).forEach(p=>{
        if(selectedPersons.has(p.id)) out.push(p);
      });
    }
  });
  return out;
}
/* Reads an Excel template as an ArrayBuffer — from the chosen register
   folder (tries each name in candidateNames in turn) when the File System
   Access API is available, otherwise from a manually-chosen <input
   type="file"> with the given id. */
async function loadTemplateBuffer(usingFolder, candidateNames, fileInputId){
  if(usingFolder){
    for(const name of candidateNames){
      try{
        const fh = await dirHandle.getFileHandle(name, {create:false});
        const file = await fh.getFile();
        return await file.arrayBuffer();
      }catch(e){ /* try next name */ }
    }
    throw new Error(`Hittade inte "${candidateNames[0]}" i den mapp där registret sparas.`);
  }
  const fileInput = document.getElementById(fileInputId);
  const memKey = 'personalregister_mall:'+candidateNames[0];
  if(fileInput && fileInput.files[0]){
    const buf = await fileInput.files[0].arrayBuffer();
    /* kom ihåg mallen i appen så att den inte behöver väljas varje gång */
    try{
      let bin=''; const bytes=new Uint8Array(buf);
      for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
      localStorage.setItem(memKey, btoa(bin));
    }catch(e){ /* för stor eller inte tillåtet — används ändå den här gången */ }
    return buf;
  }
  let saved = null;
  try{ saved = localStorage.getItem(memKey); }catch(e){}
  if(saved){
    const bin = atob(saved); const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return bytes.buffer;
  }
  throw new Error(`Välj mallfilen ${candidateNames[0]}.`);
}
function hasSavedTemplate(name){
  try{ return !!localStorage.getItem('personalregister_mall:'+name); }catch(e){ return false; }
}

const TEMPLATE_MAX_ROW = 442; // mallarna har formaterade rader 3–442
function b64ToBytes(b64){
  const bin = atob(b64); const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function xmlEscape(v){
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
}
/* cells: {"A3":"värde", ...} -> färdig .xlsx som Uint8Array */
function fillBuiltInTemplate(b64, cells){
  const cfb = XLSX.CFB.read(b64ToBytes(b64), {type:'array'});
  const idx = cfb.FullPaths.findIndex(p=>/\/xl\/worksheets\/sheet1\.xml$/.test(p));
  if(idx<0) throw new Error('Mallen saknar blad 1.');
  const entry = cfb.FileIndex[idx];
  let xml = new TextDecoder('utf-8').decode(entry.content);
  Object.keys(cells).forEach(addr=>{
    const val = cells[addr];
    if(val==null || val==='') return;
    const re = new RegExp('<c r="'+addr+'"((?:\\s[^>]*?)?)(?:/>|>[\\s\\S]*?</c>)');
    const m = xml.match(re);
    if(!m) throw new Error('Cell '+addr+' finns inte i mallen.');
    const sAttr = (m[1].match(/\ss="\d+"/)||[''])[0];
    const txt = xmlEscape(val);
    xml = xml.replace(re, '<c r="'+addr+'"'+sAttr+' t="inlineStr"><is><t xml:space="preserve">'+txt+'</t></is></c>');
  });
  entry.content = new TextEncoder().encode(xml);
  entry.size = entry.content.length;
  const out = XLSX.CFB.write(cfb, {fileType:'zip', type:'array'});
  return out instanceof Uint8Array ? out : new Uint8Array(out);
}
async function saveFilledTemplate(bytes, outFilename, usingFolder){
  const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  try{
    if(usingFolder){
      const fh = await dirHandle.getFileHandle(outFilename, {create:true});
      const writable = await fh.createWritable();
      await writable.write(blob);
      await writable.close();
    } else {
      await deliverFile(blob, outFilename);
    }
    return true;
  }catch(e){
    alert('Kunde inte spara filen: '+(e.message||e));
    return false;
  }
}
function xlsxSetCell(ws, addr, value){
  const existing = ws[addr];
  ws[addr] = Object.assign({}, existing, {t:'s', v:String(value||'')});
}
/* Grows the sheet's !ref range so newly-written cells are included when
   the workbook is saved (rowNum/colIdx are 1-based row / 0-based col). */
function xlsxExpandRange(ws, lastRow, lastColIdx){
  if(!ws['!ref']) return;
  const range = XLSX.utils.decode_range(ws['!ref']);
  if(lastRow-1 > range.e.r) range.e.r = lastRow-1;
  if(range.e.c < lastColIdx) range.e.c = lastColIdx;
  ws['!ref'] = XLSX.utils.encode_range(range);
}
/* Writes the workbook out either into the register's folder (create:true)
   or as a browser download, depending on what's available. */
async function saveGeneratedWorkbook(wb, outFilename, usingFolder){
  let outBuffer;
  try{
    outBuffer = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  }catch(e){
    alert('Kunde inte skapa filen.');
    return false;
  }
  const outBlob = new Blob([outBuffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  try{
    if(usingFolder){
      const fh = await dirHandle.getFileHandle(outFilename, {create:true});
      const writable = await fh.createWritable();
      await writable.write(outBlob);
      await writable.close();
    } else {
      await deliverFile(outBlob, outFilename);
    }
    return true;
  }catch(e){
    alert('Kunde inte spara filen: '+(e.message||e));
    return false;
  }
}

    </div>

      <div class="field checkfield full">
        <input type="checkbox" id="reportContact">
        <label for="reportContact" style="margin:0;">Lägg till kontaktuppgifter (Telefonnummer i kolumn C, Mejladress i kolumn D)</label>
      </div>
      <div class="field checkfield full">
        <input type="checkbox" id="reportGrade">
        <label for="reportGrade" style="margin:0;">Lägg till aktuell grad (i kolumnen Övrigt)</label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Avbryt</button>
      <button class="btn primary" onclick="generatePersonnelReport()">Generera</button>
    </div>
  </div>`;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  document.body.appendChild(overlay);
  setTimeout(()=>{ document.getElementById('reportFileName').focus(); },0);
}
async function generatePersonnelReport(){
  const nameInput = document.getElementById('reportFileName');
  const filename = nameInput.value.trim();
  if(!filename){ nameInput.focus(); return; }
  const withContact = document.getElementById('reportContact').checked;
  const withGrade = document.getElementById('reportGrade').checked;
  const usingFolder = fsaSupported && !!dirHandle;

  const persons = selectedPersonsInHomeOrder();
  if(!persons.length){ alert('Inga markerade personer kunde hittas.'); return; }
  const MAX_ROWS = TEMPLATE_MAX_ROW - 2; // rad 3–442
  let rows = persons;
  if(rows.length > MAX_ROWS){
    alert(`Mallen har plats för ${MAX_ROWS} personer. ${rows.length} är markerade — endast de första ${MAX_ROWS} tas med.`);
    rows = rows.slice(0, MAX_ROWS);
  }
  if(typeof XLSX === 'undefined'){ alert('Excel-biblioteket kunde inte laddas. Ladda om appen och försök igen.'); return; }

  const cells = {D1: filename};
  rows.forEach((p,i)=>{
    const r = 3+i;
    cells['A'+r] = personBefattningsnummer(p)||'';
    cells['B'+r] = p.anstallningsnummer||'';
    if(withContact){
      cells['C'+r] = p.telefonnummer||'';
      cells['D'+r] = p.mejladress||'';
    }
    if(withGrade){
      const cg = currentGrade(p);
      cells['E'+r] = cg ? cg.label : '';
    }
  });
  let bytes;
  try{ bytes = fillBuiltInTemplate(TEMPLATE_PERSONALRAPPORT_B64, cells); }
  catch(e){ alert('Kunde inte skapa rapporten: '+(e.message||e)); return; }

  const outFilename = sanitizeFileBase(filename) + '.xlsx';
  const ok = await saveFilledTemplate(bytes, outFilename, usingFolder);
  if(ok){
    closeModal();
    if(usingFolder) alert(`Rapporten sparad som "${outFilename}" i registrets mapp.`);
  }
}

    alert(`Mallen har plats för ${MAX_ROWS} personer. ${rows.length} är markerade — endast de första ${MAX_ROWS} tas med.`);
    rows = rows.slice(0, MAX_ROWS);
  }
  if(typeof XLSX === 'undefined'){ alert('Excel-biblioteket kunde inte laddas. Ladda om appen och försök igen.'); return; }

  const forband = `${DATA.kompani||''} ${DATA.pluton||''}`.trim();
  const cells = {D1: filename};
  rows.forEach((p,i)=>{
    const r = 3+i;
    const pb8 = p.kompetenser && p.kompetenser['forarbevis_pb8'];
    cells['A'+r] = forband;
    cells['B'+r] = p.namn||'';
    cells['C'+r] = p.anstallningsnummer||'';
    cells['D'+r] = p.telefonnummer||'';
    cells['E'+r] = p.mejladress||'';
    cells['F'+r] = (pb8 && pb8.has) ? 'Ja' : '';
    cells['G'+r] = p.specialkost||'';
    // kolumn H (Övrigt) lämnas medvetet tom
  });
  let bytes;
  try{ bytes = fillBuiltInTemplate(TEMPLATE_OVNINGSANMALAN_B64, cells); }
  catch(e){ alert('Kunde inte skapa övningsanmälan: '+(e.message||e)); return; }

  const outFilename = sanitizeFileBase(filename) + '.xlsx';
  const ok = await saveFilledTemplate(bytes, outFilename, usingFolder);
  if(ok){
    closeModal();
    if(usingFolder) alert(`Övningsanmälan sparad som "${outFilename}" i registrets mapp.`);
  }
}

function importJson(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    let text;
    try{ text = await decryptFromStorage(reader.result, true); }
    catch(e){ alert('Säkerhetskopian kunde inte låsas upp: '+(e.message||e)); return; }
    try{
      const parsed = JSON.parse(text);
      hydrateData(parsed);
      const label = sanitizeFileBase(DATA.title || file.name.replace(/\.json$/i,''));
      const key = uniqueLsKey(label);
      currentFileName = key;
      const list = lsLoadRegistry();
      list.push({key, label:key});
      lsSaveRegistry(list);
      registerList = list;
      saveToDisk();
      view = {name:'home'};
      renderAll();
    }catch(e){ alert('Filen kunde inte läsas som ett giltigt register.'); }
  };
  reader.readAsText(file);
}

  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function personsInGroup(gid){

}
function fullName(p){ return (p.namn||'').trim() || '(namnlös)'; }

function orderedFields(front){

function expiryPill(dateStr){

}
function recruitStepText(p){

function personBefattning(p){

  if(g && g.kind==='standard' && p.slotIndex!=null && g.slots[p.slotIndex]) return g.slots[p.slotIndex].befattning;
