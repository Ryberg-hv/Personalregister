/* ---------- kompetensförkortningar vid befattning ----------
   Personal med dessa kompetenser får förkortningen visad direkt efter
   befattningen (t.ex. "Soldat GRG KSP"), som om den vore en del av
   befattningstexten. Ordningen nedan styr i vilken ordning förkortningarna
   radas upp. Detta påverkar bara PRESENTATIONEN - den underliggande
   befattningstexten (t.ex. i platsredigering, gradmatchning och
   statistikens C-igenkänning) är opåverkad. */
const COMPETENCY_ABBR_ORDER = ['forarbevis_pb8','forarbevis_lastbil','forarbevis_tungtslap','forarbevis_bandvagn','grg','rpas','tmm','ksp','sjukvard'];
const COMPETENCY_ABBR = {
  forarbevis_pb8:'PB8',
  forarbevis_lastbil:'LB',
  forarbevis_tungtslap:'TS',
  forarbevis_bandvagn:'BV',
  grg:'GRG',
  rpas:'RPAS',
  tmm:'TMM',
  ksp:'KSP',
  sjukvard:'GSJV',
};
function personCompetencyAbbrs(p){
  if(!p || !p.kompetenser) return [];
  return COMPETENCY_ABBR_ORDER
    .filter(id=>p.kompetenser[id] && p.kompetenser[id].has)
    .map(id=>COMPETENCY_ABBR[id]);
}
function personBefattningDisplay(p){
  const bef = personBefattning(p);
  const abbrs = personCompetencyAbbrs(p);
  if(!abbrs.length) return bef;
  return (bef ? bef+' ' : '') + abbrs.join(' ');
}
/* ---------- grade (grad) calculation ---------- */
function normLabel(s){ return String(s||'').toLowerCase().replace(/[\s\-]/g,''); }
function normBef(s){ return String(s||'').trim().toLowerCase(); }
function findCompIdByLabel(label){
  const norm = normLabel(label);
  const c = DATA.competencies.find(x=>normLabel(x.label)===norm);
  return c ? c.id : null;
}
function personHasComp(p, label){
  const id = findCompIdByLabel(label);
  if(!id) return false;
  const st = p.kompetenser[id];
  return !!(st && st.has);
}
function personBefIn(p, list){
  const b = normBef(personBefattning(p));
  if(!b) return false;
  return list.some(x=>normBef(x)===b);
}
function fulfilledContractYears(p){
  const fromYears = YEARS.filter(y=> p.ovningar[y] && EXERCISE_TYPES.every(t=>p.ovningar[y][t.key] && p.ovningar[y][t.key].status==='narvarande')).length;
  return fromYears + (p.avtalsarInnanStart||0);
}
/* Fulfilled avtalsår counted only from and including a given start year —
   used for the Löjtnant-kravet, som gäller uppfyllda år specifikt i
   befattning som Stf PlutC/PlutC, inte totalt uppfyllda avtalsår i
   karriären. Returns 0 if no start year is set. */
function fulfilledContractYearsSince(p, sinceYear){
  const since = Number(sinceYear);
  if(!sinceYear && sinceYear!==0) return 0;
  if(isNaN(since)) return 0;
  return YEARS.filter(y=> y>=since && p.ovningar[y] && EXERCISE_TYPES.every(t=>p.ovningar[y][t.key] && p.ovningar[y][t.key].status==='narvarande')).length;
}
/* Antal genomförda (närvarande) avtalsövningar — varje SÖF och KFÖ räknas
   för sig, över alla år. Används för blåbandarnas grundutbildning. */
function exerciseCount(p){
  let n = 0;
  YEARS.forEach(y=>{
    const yr = p.ovningar && p.ovningar[y];
    if(!yr) return;
    EXERCISE_TYPES.forEach(t=>{ if(yr[t.key] && yr[t.key].status==='narvarande') n++; });
  });
  return n;
}
function isTrainee(p){ return !!(p && p.underUtbildning); }
function traineeTitle(p){
  return `Blåbandare — under utbildning (${Math.min(exerciseCount(p),GRUNDUTB_KRAV)}/${GRUNDUTB_KRAV} avtalsövningar)`;
}
/* Namn i fetstil — blå text för blåbandare. */
function nameStrong(p, raw){
  const txt = esc(raw!==undefined ? raw : p.namn);
  return isTrainee(p)
    ? `<strong class="trainee" title="${esc(traineeTitle(p))}">${txt}</strong>`
    : `<strong>${txt}</strong>`;
}
function gradeTest(def, p){
  if(isTrainee(p)) return def.level===1; // blåbandare kan endast ha graden Menig
  if(def.bef && !personBefIn(p, def.bef)) return false;
  if(def.orGrundutb && p.grundutbKlar){ /* grundutbildning ersätter kompetenskravet */ }
  else if(def.comps && !def.comps.every(c=>personHasComp(p,c))) return false;
  if(def.compsAny && !def.compsAny.some(c=>personHasComp(p,c))) return false;
  if(def.minYears!=null && fulfilledContractYears(p)<def.minYears) return false;
  if(def.minYearsInBef!=null && fulfilledContractYearsSince(p, p.plutcSedanAr)<def.minYearsInBef) return false;
  return true;
}
function currentGrade(p){
  let best = null;
  GRADES.forEach(def=>{ if(gradeTest(def,p)) best = def; });
  return best;
}
function missingForGrade(def, p){
  const missing = [];
  if(isTrainee(p)){
    const n = exerciseCount(p);
    if(n<GRUNDUTB_KRAV) missing.push('Grundutbildning: '+n+'/'+GRUNDUTB_KRAV+' avtalsövningar');
    else missing.push('Grundutbildning klar — notera notisen på startsidan');
    return missing;
  }
  if(def.bef && !personBefIn(p, def.bef)) missing.push('Befattning: '+def.bef.join(' eller '));
  if(def.orGrundutb && p.grundutbKlar){ /* kravet uppfyllt via grundutbildning */ }
  else if(def.comps) def.comps.forEach(c=>{ if(!personHasComp(p,c)) missing.push('Kompetens: '+c); });
  if(def.compsAny && !def.compsAny.some(c=>personHasComp(p,c))) missing.push('Kompetens: '+def.compsAny.join(' eller '));
  if(def.minYears!=null){
    const have = fulfilledContractYears(p);
    if(have<def.minYears) missing.push('Uppfyllda avtalsår: '+have+'/'+def.minYears);
  }
  return missing;
}

/* ---------- home notices (competensutgång + ny grad) ---------- */
function computeNotices(){
  ensureNotiser(DATA);
  const notices = [];
  const today = new Date(); today.setHours(0,0,0,0);
  DATA.persons.forEach(p=>{
    const g = getGroup(p.groupId);
    const gName = g ? g.name : '';
    DATA.competencies.filter(c=>c.expiry).forEach(c=>{
      const st = p.kompetenser[c.id];
      if(!st || !st.has || !st.utgangsdatum) return;
      const expiryDate = new Date(st.utgangsdatum+'T00:00:00');
      const daysLeft = Math.round((expiryDate-today)/86400000);
      [12,6,3].forEach(months=>{
        const thresholdDate = new Date(expiryDate);
        thresholdDate.setMonth(thresholdDate.getMonth()-months);
        if(today < thresholdDate) return;
        const key = p.id+'|'+c.id+'|'+st.utgangsdatum+'|'+months;
        if(DATA.notiser.expiry[key]) return;
        const desc = daysLeft<0
          ? `${c.label} gick ut ${st.utgangsdatum}`
          : `${c.label} går ut ${st.utgangsdatum} (${daysLeft} dagar kvar)`;
        notices.push({
          kind:'expiry', groupName:gName, personName:fullName(p), text:desc,
          sortKey:daysLeft,
          ackCall:`ackExpiryNotice('${p.id}','${c.id}','${st.utgangsdatum}',${months})`
        });
      });
    });
    if(isTrainee(p) && exerciseCount(p)>=GRUNDUTB_KRAV){
      notices.push({
        kind:'training', groupName:gName, personName:fullName(p),
        text:`Har genomfört ${GRUNDUTB_KRAV} avtalsövningar (SÖF/KFÖ) och är nu klar med sin grundutbildning`,
        sortKey:-200000,
        ackCall:`ackTrainingNotice('${p.id}')`
      });
    }
    const cg = currentGrade(p);
    const curLabel = cg ? cg.label : null;
    const ackLabel = DATA.notiser.grad[p.id] || null;
    /* blåbandare är alltid Menig — ingen gradnotis förrän grundutbildningen är noterad */
    if(curLabel && curLabel!==ackLabel && !isTrainee(p)){
      notices.push({
        kind:'grade', groupName:gName, personName:fullName(p),
        text:`Uppfyller nu kraven för graden ${curLabel}`,
        sortKey:-100000,
        ackCall:`ackGradeNotice('${p.id}','${curLabel.replace(/'/g,"\\'")}')`
      });
    }
  });
  DATA.notiser.flytt.forEach(n=>{
    const p = DATA.persons.find(x=>x.id===n.pid);
    if(!p) return;
    const tg = getGroup(n.toGid);
    const tName = tg ? tg.name : '';
    const why = n.occupiedMatch
      ? `raden med det numret i ${tName} är redan upptagen`
      : `numret matchar ingen rad i ${tName}`;
    notices.push({
      kind:'move', groupName:tName, personName:fullName(p),
      text:`Tidigare angivet befattningsnummer ${n.prevBefattningsnummer} kunde inte användas (${why}). Personen har placerats på första lediga rad och det tidigare numret har tagits bort.`,
      sortKey:-300000,
      ackCall:`ackMoveNotice('${n.id}')`,
      undoCall:`undoMoveNotice('${n.id}')`
    });
  });
  notices.sort((a,b)=>a.sortKey-b.sortKey);
  return notices;
}
function ackExpiryNotice(pid, cid, utg, months){
  ensureNotiser(DATA);
  DATA.notiser.expiry[pid+'|'+cid+'|'+utg+'|'+months] = true;
  saveToDisk(); renderAll();
}
function ackGradeNotice(pid, label){

}
/* Noterad grundutbildning: blå markering tas bort och personen uppfyller
   därefter kraven för Menig 1 (vilket i sin tur ger en vanlig gradnotis). */
function ackTrainingNotice(pid){
  const p = DATA.persons.find(x=>x.id===pid);
  if(!p) return;
  p.underUtbildning = false;
  p.grundutbKlar = true;
  saveToDisk(); renderAll();
}
function ackMoveNotice(nid){
  ensureNotiser(DATA);
  DATA.notiser.flytt = DATA.notiser.flytt.filter(n=>n.id!==nid);
  saveToDisk(); renderAll();
}
function undoMoveNotice(nid){
  ensureNotiser(DATA);
  const n = DATA.notiser.flytt.find(x=>x.id===nid);
  if(!n) return;
  const p = DATA.persons.find(x=>x.id===n.pid);
  const from = getGroup(n.fromGid);
  if(!p || !from){
    alert('Flytten kan inte ångras — personen eller gruppen för ny personal finns inte längre.');
  } else if(p.groupId!==n.toGid){
    alert('Flytten kan inte ångras — '+fullName(p)+' har flyttats igen sedan dess.');
  } else {
    p.groupId = n.fromGid;
    p.slotIndex = null;
    p.sortIndex = (n.prevSortIndex!=null) ? n.prevSortIndex : nextSortIndex();
    p.befattningsnummer = n.prevBefattningsnummer || '';
    p.befattning = n.prevBefattning || '';
  }
  DATA.notiser.flytt = DATA.notiser.flytt.filter(x=>x.id!==nid);
  saveToDisk(); renderAll();
}
function renderNoticeList(notices){
  if(!notices.length) return `<div class="noticeEmpty">Inga notiser just nu.</div>`;
  return notices.map(n=>`<div class="noticeItem ${n.kind}">
    <div class="noticeGroup">${esc(n.groupName)}</div>
    <div class="noticeText"><strong>${esc(n.personName)}</strong> – ${esc(n.text)}</div>
    <button class="btn tiny" onclick="${n.ackCall}">Noterat</button>${n.undoCall ? ` <button class="btn tiny" onclick="${n.undoCall}">Ångra flytt</button>` : ''}
  </div>`).join('');
}

function firstVacantSlot(gid){
  const g = getGroup(gid);
  if(!g || !g.slots) return -1;
  const occupied = new Set(DATA.persons.filter(p=>p.groupId===gid && p.slotIndex!=null).map(p=>p.slotIndex));
  for(let i=0;i<g.slots.length;i++){ if(!occupied.has(i)) return i; }
  return -1;
}
function standardGroupRows(gid){
  const g = getGroup(gid);
  const rows = g.slots.map((slot,idx)=>({idx, slot, person:null, overflow:false}));
  const claimed = new Set();
  DATA.persons.filter(p=>p.groupId===gid).forEach(p=>{
    if(p.slotIndex!=null && p.slotIndex>=0 && p.slotIndex<g.slots.length && !claimed.has(p.slotIndex)){
      rows[p.slotIndex].person = p; claimed.add(p.slotIndex);
    }
  });
  DATA.persons.filter(p=>p.groupId===gid).forEach(p=>{
    const placedHere = p.slotIndex!=null && rows[p.slotIndex] && rows[p.slotIndex].person===p;
    if(!placedHere) rows.push({idx:null, slot:null, person:p, overflow:true});
  });
  return rows;
}
/* status of the primary groups (1–5), used to tell whether the reserve
   (Grupp 6 / "Personalreserv") is meant to be drawn on yet */
const PRIMARY_GROUP_IDS = ['g1','g2','g3','g4','g5'];
function primaryGroupsStatus(){
  let totalSlots=0, filled=0;
  PRIMARY_GROUP_IDS.forEach(gid=>{
    const g = getGroup(gid);
    if(!g || !g.slots) return;
    totalSlots += g.slots.length;
    filled += standardGroupRows(gid).filter(r=>r.person && !r.overflow).length;
  });
  return {filled, totalSlots, vacant: totalSlots-filled, full: totalSlots>0 && filled>=totalSlots};
}
function reserveBanner(){
  const st = primaryGroupsStatus();
  return st.full
    ? `<div class="banner info" style="margin-bottom:16px;">Grupp 1–5 är fulltaliga (${st.filled}/${st.totalSlots}) — personalreserven kan användas.</div>`
    : `<div class="banner info" style="margin-bottom:16px;">Grupp 1–5 har fortfarande ${st.vacant} lediga platser (${st.filled}/${st.totalSlots} fyllda). Personalreserven är avsedd att användas först när grupp 1–5 är fulltaliga.</div>`;
}

  else if(view.name==='group') app.innerHTML = renderGroup(view.gid);
  else if(view.name==='person') app.innerHTML = renderPerson(view.pid, view.tab);
  else if(view.name==='overview') app.innerHTML = renderOverview();
  else if(view.name==='stats') app.innerHTML = renderStats();
  else if(view.name==='gradoverview') app.innerHTML = renderGradOverview();
  else app.innerHTML = renderHome();
}

/* ---------- app-installation och säkerhetskopia ---------- */
let deferredInstallPrompt = null;
const LS_INSTALL_DISMISS = 'personalregister_install_dismissed';
function isStandalone(){
  return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(DATA || view.name==='setup') renderAll();
});
window.addEventListener('appinstalled', ()=>{ deferredInstallPrompt = null; renderAll(); });
async function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  try{ await deferredInstallPrompt.userChoice; }catch(e){}
  deferredInstallPrompt = null;
  renderAll();
}
function dismissInstallBanner(){
  try{ localStorage.setItem(LS_INSTALL_DISMISS,'1'); }catch(e){}
  renderAll();
}
function renderInstallBanner(){
  if(isStandalone() || !/^https?:/.test(location.protocol)) return '';
  let dismissed = false;
  try{ dismissed = localStorage.getItem(LS_INSTALL_DISMISS)==='1'; }catch(e){}
  if(dismissed) return '';
  if(deferredInstallPrompt){
    return `<div class="banner info" id="installBanner"><span>Installera registret som en app — egen ikon, helskärm och fungerar utan uppkoppling.</span>
      <span style="display:flex;gap:8px;"><button class="btn primary small" onclick="installApp()">Installera app</button><button class="btn small" onclick="dismissInstallBanner()">Inte nu</button></span></div>`;
  }
  if(isIOS()){
    return `<div class="banner info" id="installBanner"><span>Installera som app på iPhone/iPad: tryck på <strong>Dela</strong> (fyrkanten med pil uppåt) och välj <strong>Lägg till på hemskärmen</strong>.</span>
      <button class="btn small" onclick="dismissInstallBanner()">OK</button></div>`;
  }
  return '';
}
const BACKUP_REMIND_DAYS = 14;
function renderBackupBanner(){
  /* bara när registret ligger i appen/webbläsaren (telefon, iPhone, webbläsare utan mappstöd) */
  if(!DATA || !DATA.persons.length) return '';
  const t = lastBackupTime();
  const days = t ? Math.floor((Date.now()-t)/86400000) : null;
  if(days!==null && days < BACKUP_REMIND_DAYS) return '';
  const when = days===null ? 'Du har inte gjort någon säkerhetskopia av det här registret ännu.' : `Senaste säkerhetskopian gjordes för ${days} dagar sedan.`;
  return `<div class="banner" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
    <span>${when} Registret finns bara i appen på den här enheten — tas appen bort försvinner det. Spara en kopia i Filer eller mejla den till dig själv.</span>
    <button class="btn primary small" onclick="exportJson()">Säkerhetskopiera nu</button>
  </div>`;
}

function renderStandardCard(g){
  const cols = orderedFields(true);
  const rows = standardGroupRows(g.id).filter(r=>!r.overflow);
  const filled = rows.filter(r=>r.person).length;
  const body = rows.map(row=>{
    const cells = cols.map(c=>{
      let val;
      if(c.key==='befattning') val = row.person ? personBefattningDisplay(row.person) : row.slot.befattning;
      else if(c.key==='befattningsnummer') val = row.slot.befattningsnummer;
      else val = row.person ? row.person[c.key] : '';
      const bold = (c.key==='namn');
      const shown = val ? (bold?nameStrong(row.person, val):esc(val)) : (row.person?'':'<span style="color:var(--ink-faint)">–</span>');
      return `<td>${shown}</td>`;
    }).join('');
    const checkCell = row.person
      ? `<td style="width:1%;" onclick="event.stopPropagation()"><input type="checkbox" ${selectedPersons.has(row.person.id)?'checked':''} onchange="togglePersonSelected('${row.person.id}')"></td>`
      : `<td style="width:1%;"></td>`;
    return `<tr class="datarow ${row.person?'':'vacant'}" onclick="goGroup('${g.id}')">${checkCell}${cells}</tr>`;
  }).join('');
  const overflowNote = standardGroupRows(g.id).some(r=>r.overflow)
    ? `<div style="padding:8px 14px;font-size:12px;color:var(--warn);">Det finns personal utan fast plats i gruppen — öppna gruppen för att tilldela plats.</div>` : '';
  const reserveNote = g.id==='g6'
    ? (()=>{ const st = primaryGroupsStatus();
        return `<div style="padding:8px 14px;font-size:12px;color:${st.full?'var(--accent)':'var(--warn)'};">${st.full ? `Grupp 1–5 fulltaliga — reserven kan användas.` : `Grupp 1–5 har ${st.vacant} lediga platser kvar innan reserven är avsedd att användas.`}</div>`;
      })()
    : '';
  return `<div class="card kind-standard">
    <div class="card-head">
      <h3 id="gname-${g.id}" onclick="editGroupName('${g.id}')">${esc(g.name)}</h3>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="card-count">${filled}/${g.slots.length} platser fyllda</span>
        <button class="btn small" onclick="openExportModal('group','${g.id}')">Exportera</button>
        <button class="btn small" onclick="openSlackImportModal('${g.id}')">Importera från Slack</button>
        <button class="btn small" onclick="goGroup('${g.id}')">Öppna gruppen →</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
    <table class="mini-table">
      <thead><tr><th style="width:1%;"></th>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead>
      <tbody>${body}</tbody>
    </table>
    </div>
    ${overflowNote}
    ${reserveNote}
  </div>`;
}

function renderFlexibleCard(g){
  const cols = orderedFields(true).filter(c=>!FLEX_HIDDEN_FIELDS.includes(c.key));
  const people = personsInGroup(g.id);
  const showStep = g.kind==='recruit';
  const rowCell = (p,c)=>{
    const bold = (c.key==='namn');
    const val = p[c.key];
    if(COPYABLE_FIELDS.includes(c.key) && val){
      const shown = bold ? nameStrong(p, val) : esc(val);
      return `<td><div class="copyCell"><span>${shown}</span>${copyFieldBtn(val, c.label)}</div></td>`;
    }
    return `<td>${bold?nameStrong(p, val):esc(val)}</td>`;
  };
  const rows = people.length
    ? people.map(p=>`<tr class="datarow" onclick="goGroup('${g.id}')"><td style="width:1%;" onclick="event.stopPropagation()"><input type="checkbox" ${selectedPersons.has(p.id)?'checked':''} onchange="togglePersonSelected('${p.id}')"></td>${cols.map(c=>rowCell(p,c)).join('')}${showStep?`<td>${esc(recruitStepText(p))}</td>`:''}</tr>`).join('')
    : `<tr class="empty-row"><td style="width:1%;"></td><td colspan="${cols.length+(showStep?1:0)}">Ingen personal registrerad ännu</td></tr>`;
  return `<div class="card kind-${g.kind}">
    <div class="card-head">
      <h3 id="gname-${g.id}" onclick="editGroupName('${g.id}')">${esc(g.name)}</h3>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="card-count">${people.length} st</span>
        <button class="btn small" onclick="openExportModal('group','${g.id}')">Exportera</button>
        <button class="btn small" onclick="openSlackImportModal('${g.id}')">Importera från Slack</button>
        <button class="btn small" onclick="goGroup('${g.id}')">Öppna gruppen →</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
    <table class="mini-table">
      <thead><tr><th style="width:1%;"></th>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}${showStep?'<th>Rekryteringssteg</th>':''}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  </div>`;
}

function setGroupSelected(gid, on){
  personsInGroup(gid).forEach(p=>{ if(on) selectedPersons.add(p.id); else selectedPersons.delete(p.id); });
  renderAll();
}
function togglePersonSelected(pid){
  if(selectedPersons.has(pid)) selectedPersons.delete(pid);
  else selectedPersons.add(pid);
  renderAll();
}
function selectAllPersons(){
  DATA.persons.forEach(p=>selectedPersons.add(p.id));
  renderAll();
}
function deselectAllPersons(){
  selectedPersons.clear();
  renderAll();
}

function editGroupName(gid){
  const h = document.getElementById('gname-'+gid);
  const g = getGroup(gid);
  const input = document.createElement('input');
  input.className='groupNameEdit'; input.value=g.name;
  h.replaceWith(input); input.focus(); input.select();
  const commit = ()=>{
    g.name = input.value.trim() || g.name;
    saveToDisk(); renderAll();
  };
  input.onblur = commit;
  input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); input.blur(); } };
}

/* ---------- column order panel ---------- */
function renderColumnPanel(){
  const rows = DATA.columnOrder.map((key,i)=>{
    const f = FIELD_MAP[key];
    if(!f) return '';
    return `<div class="colrow">
      <span>${esc(f.label)}</span>
      <span class="arrows">
        <button class="arrowbtn" ${i===0?'disabled':''} onclick="moveColumn(${i},-1)">↑</button>
        <button class="arrowbtn" ${i===DATA.columnOrder.length-1?'disabled':''} onclick="moveColumn(${i},1)">↓</button>
      </span>
    </div>`;
  }).join('');
  return `<div id="columnPanel">
    <h4>Ordning på uppgifter (gäller startsidan och gruppvyns register)</h4>
    ${rows}
  </div>`;
}
function toggleColumnPanel(){ columnPanelOpen = !columnPanelOpen; renderAll(); }
function moveColumn(i, dir){
  const arr = DATA.columnOrder;
  const j = i+dir;
  if(j<0||j>=arr.length) return;
  [arr[i],arr[j]] = [arr[j],arr[i]];
  saveToDisk(); renderAll();
}

/* ---------- group view ---------- */
function renderGroup(gid){
  const g = getGroup(gid);
  if(!g) return renderHome();
  return g.kind==='standard' ? renderGroupStandard(gid) : renderGroupFlexible(gid);
}

function renderGroupStandard(gid){
  const g = getGroup(gid);
  const cols = orderedFields(false);
  const rows = standardGroupRows(gid);
  const filled = rows.filter(r=>r.person && !r.overflow).length;
  const otherGroups = DATA.groups.filter(x=>x.id!==gid);

  const bodyRows = rows.map(row=>{
    if(row.overflow){
      const p = row.person;
      const vacantOptions = g.slots.map((s,i)=>{
        const taken = DATA.persons.some(x=>x.groupId===gid && x.slotIndex===i);
        return taken ? '' : `<option value="${i}">${esc(s.befattning||('Plats '+(i+1)))}</option>`;
      }).join('');
      return `<tr class="datarow">
        <td colspan="${cols.length}" style="font-style:italic;color:var(--warn);">Utan fast plats: <span class="${isTrainee(p)?'trainee':''}">${esc(fullName(p))}</span>${p.befattning?' ('+esc(personBefattningDisplay(p))+')':''}</td>
        <td class="actions"><div class="rowActions">
          <select onchange="if(this.value!==''){assignPersonToSlot('${p.id}','${gid}',this.value);}">
            <option value="">Tilldela plats…</option>
            ${vacantOptions}
          </select>
          <select onchange="if(this.value){movePersonToGroup('${p.id}', this.value); this.value='';}">
            <option value="">Flytta till annan grupp…</option>
            ${otherGroups.map(og=>`<option value="${og.id}">${esc(og.name)}</option>`).join('')}
          </select>
          <button class="btn small" onclick="copyPersonInfo('${p.id}', this)">Kopiera</button>
          <button class="btn small" onclick="openPersonForm('${gid}','${p.id}')">Redigera</button>
        </div></td>
      </tr>`;
    }
    const p = row.person;
    const slot = row.slot;
    const cells = cols.map(c=>{
      if(c.key==='befattning'){
        const befShown = p ? personBefattningDisplay(p) : slot.befattning;
        return `<td class="slotfield" id="slotcell-${gid}-${row.idx}-befattning" onclick="editSlotField('${gid}',${row.idx},'befattning')">${befShown?esc(befShown):'<span style="color:var(--ink-faint)">(namnge befattning)</span>'}</td>`;
      }
      if(c.key==='befattningsnummer'){
        return `<td class="slotfield" id="slotcell-${gid}-${row.idx}-befattningsnummer" onclick="editSlotField('${gid}',${row.idx},'befattningsnummer')">${slot.befattningsnummer?esc(slot.befattningsnummer):'<span style="color:var(--ink-faint)">–</span>'}</td>`;
      }
      if(p){
        const bold = (c.key==='namn');
        const raw = p[c.key];
        if(COPYABLE_FIELDS.includes(c.key) && raw){
          const shown = bold ? nameStrong(p, raw) : esc(raw);
          return `<td class="clickable" onclick="goPerson('${p.id}')"><div class="copyCell"><span>${shown}</span>${copyFieldBtn(raw, c.label)}</div></td>`;
        }
        const val = bold ? nameStrong(p, raw) : esc(raw);
        return `<td class="clickable" onclick="goPerson('${p.id}')">${val}</td>`;
      }
      return `<td style="color:var(--ink-faint);">–</td>`;
    }).join('');
    const actions = p
      ? `<div class="rowActions">
          <button class="btn tiny" ${row.idx===0?'disabled':''} onclick="movePerson('${p.id}',-1)" title="Byt till platsen ovanför">↑</button>
          <button class="btn tiny" ${row.idx===g.slots.length-1?'disabled':''} onclick="movePerson('${p.id}',1)" title="Byt till platsen nedanför">↓</button>
          <select onchange="if(this.value){movePersonToGroup('${p.id}', this.value); this.value='';}">
            <option value="">Flytta till…</option>
            ${otherGroups.map(og=>`<option value="${og.id}">${esc(og.name)}</option>`).join('')}
          </select>
          <button class="btn small" onclick="copyPersonInfo('${p.id}', this)">Kopiera</button>
          <button class="btn small" onclick="openPersonForm('${gid}','${p.id}')">Redigera</button>
        </div>`
      : `<button class="btn small primary" onclick="openPersonForm('${gid}', null, ${row.idx})">+ Tilldela person</button>`;
    return `<tr class="datarow ${p?'':'vacant'}">${cells}<td class="actions">${actions}</td></tr>`;
  }).join('');

  return `
    <div class="crumbs"><a onclick="goHome()">Startsida</a> / ${esc(g.name)}</div>
    <div class="viewhead">
      <div>
        <h2 id="gname2-${g.id}" onclick="editGroupNameGroupView('${g.id}')">${esc(g.name)}</h2>
        <div class="sub">${filled}/${g.slots.length} platser fyllda. Befattning och befattningsnummer hör till platsen, inte personen — klicka på dem för att ändra. Pilarna byter plats inom gruppen.</div>
      </div>
      <div class="headActions">
        <button class="btn small" onclick="toggleColumnPanel()">Ordna kolumner</button>
        <button class="btn small" onclick="openExportModal('group','${gid}')">Exportera</button>
        <button class="btn small" onclick="openSlackImportModal('${gid}')">Importera från Slack</button>
      </div>
    </div>
    ${columnPanelOpen ? renderColumnPanel() : ''}
    ${gid==='g6' ? reserveBanner() : ''}
    <div class="tablewrap">
      <table class="full">
        <thead><tr>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}<th></th></tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>
  `;
}

function renderRecruitStepSelect(p){
  const step = RECRUIT_STEP_MAP[p.rekrytering.steg] || RECRUIT_STEPS[0];
  const dateVal = step.date ? (p.rekrytering.datum[step.key]||'') : '';
  return `<select onchange="setRecruitStep('${p.id}', this.value)">
      ${RECRUIT_STEPS.map(s=>`<option value="${s.key}" ${p.rekrytering.steg===s.key?'selected':''}>${esc(s.label)}</option>`).join('')}
    </select>
    ${step.date ? `<input type="date" value="${esc(dateVal)}" onchange="setRecruitDate('${p.id}','${step.key}',this.value)">` : ''}`;
}
function setRecruitStep(pid, val){
  const p = DATA.persons.find(x=>x.id===pid);
  p.rekrytering.steg = val;
  /* steget "Under utbildning" gör personen till blåbandare */
  if(val==='utbildning' && !p.grundutbKlar){ p.underUtbildning = true; p.grad = 'Menig'; }
  saveToDisk(); renderAll();
}

function assignPersonToSlot(pid, gid, slotIdxStr){
  const idx = parseInt(slotIdxStr,10);
  if(isNaN(idx)) return;
  const g = getGroup(gid);
  const p = DATA.persons.find(x=>x.id===pid);
  if(!p || !g || !g.slots[idx]) return;
  const occupied = DATA.persons.some(x=>x.groupId===gid && x.slotIndex===idx);
  if(occupied){ alert('Platsen är redan upptagen.'); return; }
  p.groupId = gid;
  p.slotIndex = idx;
  saveToDisk(); renderAll();
}

/* ---------- reordering & moving between groups ---------- */
function movePerson(pid, dir){
  const p = DATA.persons.find(x=>x.id===pid);
  if(!p) return;
  const g = getGroup(p.groupId);
  if(g.kind==='standard'){
    if(p.slotIndex==null) return;
    const newIdx = p.slotIndex + dir;
    if(newIdx<0 || newIdx>=g.slots.length) return;
    const occupant = DATA.persons.find(x=>x.groupId===p.groupId && x.slotIndex===newIdx);
    if(occupant) occupant.slotIndex = p.slotIndex;
    p.slotIndex = newIdx;
  } else {
    const list = personsInGroup(p.groupId);
    const idx = list.findIndex(x=>x.id===pid);
    const j = idx+dir;
    if(j<0||j>=list.length) return;
    const other = list[j];
    const tmp = p.sortIndex; p.sortIndex = other.sortIndex; other.sortIndex = tmp;
  }
  saveToDisk(); renderAll();
}

function movePersonToGroup(pid, newGid){
  const p = DATA.persons.find(x=>x.id===pid);
  if(!p || !newGid || p.groupId===newGid) return;
  const oldGroup = getGroup(p.groupId);
  const newGroup = getGroup(newGid);
  if(oldGroup.kind==='standard' && p.slotIndex!=null && oldGroup.slots[p.slotIndex]){
    const slot = oldGroup.slots[p.slotIndex];
    p.befattning = slot.befattning;
    p.befattningsnummer = slot.befattningsnummer;
  }
  if(newGroup.kind==='standard'){
    const vacant = firstVacantSlot(newGid);
    if(vacant<0){ alert('Alla platser i "'+newGroup.name+'" är redan fyllda.'); return; }
    /* Från "Ny personal": angivet befattningsnummer matchas mot gruppens
       fixerade befattningsnummer. Ingen (ledig) träff -> första lediga rad,
       det tidigare numret glöms och en notis med "Ångra flytt" skapas. */
    if(oldGroup.kind==='recruit'){
      const wanted = String(p.befattningsnummer||'').trim();
      let target = vacant, mismatch = false, occupiedMatch = false;
      if(wanted){
        const matchIdx = newGroup.slots.findIndex(sl=>String(sl.befattningsnummer||'').trim().toLowerCase()===wanted.toLowerCase());
        if(matchIdx>=0 && !DATA.persons.some(x=>x.groupId===newGid && x.slotIndex===matchIdx)){
          target = matchIdx;
        } else {
          mismatch = true;
          occupiedMatch = matchIdx>=0;
        }
      }
      if(mismatch){
        ensureNotiser(DATA);
        DATA.notiser.flytt.push({
          id: uid(), pid: p.id,
          fromGid: p.groupId, prevSortIndex: p.sortIndex,
          prevBefattningsnummer: p.befattningsnummer, prevBefattning: p.befattning,
          toGid: newGid, toSlot: target, occupiedMatch
        });
        p.befattningsnummer = '';
      }
      p.groupId = newGid;
      p.slotIndex = target;
      saveToDisk(); renderAll();
      return;
    }
    p.groupId = newGid;
    p.slotIndex = vacant;
  } else {
    p.groupId = newGid;
    p.slotIndex = null;
    p.sortIndex = nextSortIndex();
  }
  saveToDisk(); renderAll();
}

  const gradEl = document.getElementById('pf_grad');
  if(!gradEl) return;

  else { gradEl.disabled = false; if(gradEl.dataset.prev!==undefined) gradEl.value = gradEl.dataset.prev; }

function savePersonForm(existingId, gid, slotIndex){
  let p = existingId ? DATA.persons.find(x=>x.id===existingId) : emptyPerson(gid);
  if(!existingId){
    if(slotIndex!==null && slotIndex!==undefined) p.slotIndex = slotIndex;
    DATA.persons.push(p);

  FIELD_DEFS.forEach(f=>{
    const elx = document.getElementById('pf_'+f.key);
    if(elx) p[f.key] = elx.value.trim();

      if(groupKind(p.groupId)==='recruit' && p.rekrytering) p.rekrytering.steg = 'utbildning';

  view = {name:'group', gid: p.groupId};

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve,reject)=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    }catch(e){ reject(e); }
  });
}

function parseDelimited(text){
  const lines = text.split(/\r\n|\r|\n/).filter(l=>l.trim().length>0);
  if(!lines.length) return {headers:[], rows:[]};
  const delim = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') && !lines[0].includes(',') ? ';' : ',');
  const splitLine = (line)=>{
    const out = []; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(inQ){
        if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
        else cur+=ch;
      } else {
        if(ch==='"') inQ=true;
        else if(ch===delim){ out.push(cur); cur=''; }
        else cur+=ch;
      }
    }
    out.push(cur);
    return out.map(s=>s.trim());
  };
  const headers = splitLine(lines[0]);
  const rows = lines.slice(1).map(splitLine);
  return {headers, rows};
}
function guessImportMapping(header){
  const h = header.toLowerCase().trim();
  if(/^(för ?namn|first ?name)$/.test(h)) return '__forename';
  if(/^(efter ?namn|last ?name|surname)$/.test(h)) return '__surname';
  if(h==='namn'||h==='name'||h.includes('fullständigt namn')) return 'namn';
  if(h.includes('befattningsnummer')) return 'befattningsnummer';
  if(h.includes('befattning')||h.includes('roll')||h.includes('tjänst')||h.includes('position')) return 'befattning';
  if(h.includes('anställningsnr')||h.includes('anst.nr')||h.includes('anställningsnummer')) return 'anstallningsnummer';
  if(h==='grad'||h.includes('rank')) return 'grad';
  if(h.includes('anställningsår')||h.includes('startår')) return 'anstallningsar';
  if(h.includes('telefon')||h.includes('mobil')||h.includes('phone')) return 'telefonnummer';
  if(h.includes('mejl')||h.includes('mail')||h.includes('e-post')||h.includes('epost')) return 'mejladress';
  if(h.includes('hemadress')||h==='adress'||h.includes('address')) return 'hemadress';
  if(h.includes('arbetsplats')||h.includes('workplace')) return 'arbetsplats';
  if(h.includes('specialkost')||h.includes('kost')||h.includes('diet')) return 'specialkost';
  return '';
}
function parseImportData(){
  const text = document.getElementById('impText').value;
  const {headers, rows} = parseDelimited(text);
  if(!headers.length || !rows.length){
    alert('Kunde inte hitta några rader att importera. Kontrollera att första raden är kolumnrubriker och att det finns minst en datarad.');
    return;
  }
  const gid = document.getElementById('impGroup').value;
  const g = DATA.groups.find(x=>x.id===gid);
  const isStandard = g && g.kind==='standard';
  importState = {headers, rows, gid};
  const mapArea = document.getElementById('impMapArea');
  const optionsHtml = (selected)=>IMPORT_TARGETS
    .filter(t=> !isStandard || (t.value!=='befattning' && t.value!=='befattningsnummer'))
    .map(t=>`<option value="${t.value}" ${t.value===selected?'selected':''}>${esc(t.label)}</option>`).join('');
  const rowsHtml = headers.map((h,i)=>{
    let guess = guessImportMapping(h);
    if(isStandard && (guess==='befattning'||guess==='befattningsnummer')) guess='';
    return `<tr><td>${esc(h)}</td><td><select id="impMap_${i}">${optionsHtml(guess)}</select></td></tr>`;
  }).join('');
  const note = isStandard ? `<p style="color:var(--ink-soft);font-size:12px;margin:6px 0 0;">${esc(g.name)} har fasta platser med förbestämd befattning, så befattning importeras inte som personuppgift. Personer utan ledig plats hamnar längst ner i gruppen som "utan fast plats", redo att tilldelas manuellt.</p>` : '';
  mapArea.innerHTML = `
    <div style="margin:14px 0 6px;font-weight:600;font-size:13px;">Matcha kolumner (${rows.length} rader hittades)</div>
    <table class="exercise"><thead><tr><th>Kolumn i filen</th><th>Motsvarar</th></tr></thead><tbody>${rowsHtml}</tbody></table>
    ${note}
  `;
  const btn = document.getElementById('impConfirmBtn');
  btn.style.display = '';
  btn.textContent = `Importera ${rows.length} person${rows.length===1?'':'er'}`;
}
function confirmImport(){
  if(!importState) return;
  const {headers, rows, gid} = importState;
  const g = DATA.groups.find(x=>x.id===gid);
  if(!g){ alert('Gruppen kunde inte hittas.'); return; }
  const mapping = headers.map((h,i)=>{
    const el = document.getElementById('impMap_'+i);
    return el ? el.value : '';
  });
  let count = 0;
  rows.forEach(cells=>{
    const p = emptyPerson(gid);
    let forename='', surname='';
    let hasAny = false;
    headers.forEach((h,i)=>{
      const target = mapping[i];
      const val = (cells[i]||'').trim();
      if(!target || !val) return;
      hasAny = true;
      if(target==='__forename') forename = val;
      else if(target==='__surname') surname = val;
      else p[target] = val;
    });
    if(forename||surname) p.namn = `${forename} ${surname}`.trim();
    if(!hasAny) return;
    p.slotIndex = null;
    DATA.persons.push(p);
    count++;
  });
  migrateFreeformToSlots();
  closeModal();
  importState = null;
  saveToDisk();
  view = {name:'group', gid};
  renderAll();
}

function copyPersonInfo(pid, btn){
  const p = DATA.persons.find(x=>x.id===pid);
  if(!p) return;
  const text = personCopyText(p);
  copyToClipboard(text).then(()=>{
    if(btn){
      const orig = btn.textContent;
      btn.textContent = 'Kopierat!';
      setTimeout(()=>{ btn.textContent = orig; }, 1500);
    }
  }).catch(()=>{
    alert('Kunde inte kopiera automatiskt. Uppgifterna:\n\n'+text);
  });
}

/* ---------- person view: kompetenser / ovningar / utvecklingsplan ---------- */
function renderPerson(pid, tab){
  const p = DATA.persons.find(x=>x.id===pid);
  if(!p) return renderHome();
  const g = getGroup(p.groupId);
  const isRecruit = g.kind==='recruit';
  /* blåbandare i rekryteringsgruppen behöver kunna föra in sina övningar */
  const showOv = !isRecruit || isTrainee(p);
  let body = '';
  if(tab==='ovningar' && showOv) body = renderOvningar(p);
  else if(tab==='plan' && !isRecruit) body = renderPlan(p);
  else body = renderKompetenser(p);
  const traineeTag = isTrainee(p)
    ? `<span class="traineeTag">Blåbandare · ${Math.min(exerciseCount(p),GRUNDUTB_KRAV)}/${GRUNDUTB_KRAV} avtalsövningar</span>`
    : '';

  return `
    <div class="crumbs"><a onclick="goHome()">Startsida</a> / <a onclick="goGroup('${g.id}')">${esc(g.name)}</a> / ${esc(fullName(p))}</div>
    <div class="viewhead">
      <div>
        <h2><span class="${isTrainee(p)?'trainee':''}">${esc(fullName(p))}</span>${traineeTag}</h2>
        <div class="sub">${esc(personBefattningDisplay(p)||'—')} · ${esc(g.name)}${isRecruit ? ' · Steg: '+esc(recruitStepText(p)) : ''}</div>
      </div>
      <div class="headActions">
        <button class="btn small" onclick="copyPersonInfo('${p.id}', this)">Kopiera uppgifter</button>
        <button class="btn small" onclick="openPersonForm('${g.id}','${p.id}')">Redigera uppgifter</button>
      </div>
    </div>
    ${(()=>{
        const skip = ['namn','befattning'];
        const items = FIELD_DEFS.filter(f=>!skip.includes(f.key) && p[f.key]).map(f=>
          `<div class="contactItem"><span class="lbl">${esc(f.label)}</span><span>${esc(p[f.key])}</span>${copyFieldBtn(p[f.key], f.label)}</div>`
        ).join('');
        return items ? `<div class="contactPanel">${items}</div>` : '';
      })()}
    ${isRecruit ? `<div class="panel" style="margin-bottom:18px;">
        <div style="font-weight:600;font-size:12px;color:var(--ink-soft);margin-bottom:6px;">Rekryteringssteg</div>
        ${renderRecruitStepSelect(p)}
      </div>` : ''}
    <div class="tabs">
      <button class="tab ${tab!=='ovningar'&&tab!=='plan'?'active':''}" onclick="goPerson('${p.id}','kompetenser')">Kompetenser</button>
      ${showOv ? `<button class="tab ${tab==='ovningar'?'active':''}" onclick="goPerson('${p.id}','ovningar')">Avtalsövningar</button>` : ''}
      ${!isRecruit ? `<button class="tab ${tab==='plan'?'active':''}" onclick="goPerson('${p.id}','plan')">Utvecklingsplan</button>` : ''}
    </div>
    ${body}
  `;
}

function renderKompetenser(p){
  const rows = DATA.competencies.map(c=>{
    const state = p.kompetenser[c.id] || {has:false,utgangsdatum:''};
    return `<div class="comp-row">
      <label class="checkwrap">
        <input type="checkbox" ${state.has?'checked':''} onchange="toggleCompetency('${p.id}','${c.id}',this.checked)">
        <span class="comp-label ${/^[A-ZÅÄÖ]/.test(c.label)?'caps':''}">${esc(c.label)}</span>
      </label>
      ${c.expiry ? `<div class="expiry">
          <span>Utgångsdatum:</span>
          <input type="date" value="${esc(state.utgangsdatum||'')}" ${state.has?'':'disabled'} onchange="setCompetencyExpiry('${p.id}','${c.id}',this.value)">
          ${state.has ? expiryPill(state.utgangsdatum) : ''}
        </div>` : ''}
      <label class="checkwrap" title="Visa summering av denna kompetens på statistiksidan">
        <input type="checkbox" ${c.showInStats?'checked':''} onchange="toggleCompetencyStat('${c.id}',this.checked)">
        <span style="font-size:11px;color:var(--ink-soft);">Visa i statistik</span>
      </label>
    </div>`;
  }).join('');
  return `<div class="panel">
    ${rows}
    <div class="addCompRow">
      <button class="btn small" onclick="openCompetencyForm()">+ Lägg till egen kompetens</button>
    </div>
  </div>`;
}
function toggleCompetencyStat(id, checked){
  const c = DATA.competencies.find(x=>x.id===id);
  if(!c) return;
  c.showInStats = checked;
  saveToDisk(); renderAll();
}
function toggleCompetency(pid, key, checked){
  const p = DATA.persons.find(x=>x.id===pid);
  if(!p.kompetenser[key]) p.kompetenser[key]={has:false,utgangsdatum:''};
  p.kompetenser[key].has = checked;
  saveToDisk(); renderAll();
}
function setCompetencyExpiry(pid, key, val){
  const p = DATA.persons.find(x=>x.id===pid);
  p.kompetenser[key].utgangsdatum = val;
  saveToDisk(); renderAll();
}
function openCompetencyForm(){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>Lägg till egen kompetens</h3>
    <div class="formgrid">
      <div class="field full"><label>Namn på kompetensen</label><input id="cf_label" placeholder="t.ex. HLR-instruktör"></div>
      <div class="field checkfield"><input type="checkbox" id="cf_expiry"><label style="margin:0;">Kräver utgångsdatum</label></div>
      <div class="field checkfield"><input type="checkbox" id="cf_showstats"><label style="margin:0;">Visa i statistik</label></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Avbryt</button>
      <button class="btn primary" onclick="saveCompetencyForm()">Lägg till</button>
    </div>
  </div>`;
  overlay.onclick=(e)=>{ if(e.target===overlay) closeModal(); };
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('cf_label').focus(),0);
}
function saveCompetencyForm(){
  const label = document.getElementById('cf_label').value.trim();
  if(!label) return;
  const expiry = document.getElementById('cf_expiry').checked;
  const showInStats = document.getElementById('cf_showstats').checked;
  const id = uid();
  DATA.competencies.push({id, label, expiry, showInStats});
  DATA.persons.forEach(p=>{ if(!p.kompetenser[id]) p.kompetenser[id]={has:false,utgangsdatum:''}; });
  closeModal();
  saveToDisk();
  renderAll();
}

function renderOvningar(p){
  const rows = YEARS.map(y=>{
    const yearOk = EXERCISE_TYPES.every(t=>p.ovningar[y][t.key].status==='narvarande');
    const cells = EXERCISE_TYPES.map(t=>{
      const st = p.ovningar[y][t.key];
      return `<td>
        <div class="exwrap">
          <label class="miniCheck"><input type="checkbox" ${st.status==='narvarande'?'checked':''} onchange="toggleExerciseStatus('${p.id}',${y},'${t.key}','narvarande')"> Närvarande</label>
          <label class="miniCheck"><input type="checkbox" ${st.status==='franvarande'?'checked':''} onchange="toggleExerciseStatus('${p.id}',${y},'${t.key}','franvarande')"> Frånvarande</label>
          ${st.status==='franvarande' ? `<input class="reason" type="text" placeholder="Anledning…" value="${esc(st.anledning)}" onblur="setExerciseReason('${p.id}',${y},'${t.key}',this.value)">` : ''}
        </div>
      </td>`;
    }).join('');
    return `<tr class="${yearOk?'yearOk':''}"><td class="year">${y}</td>${cells}</tr>`;
  }).join('');
  const done = exerciseCount(p);
  const traineePanel = isTrainee(p)
    ? `<div class="panel" style="margin-bottom:14px;border-left:4px solid #1F5FBF;">
        <div style="font-weight:600;color:#1F5FBF;margin-bottom:6px;">Grundutbildning (blåbandare)</div>
        <div style="font-size:13px;">Genomförda avtalsövningar: <strong>${Math.min(done,GRUNDUTB_KRAV)}/${GRUNDUTB_KRAV}</strong> (varje SÖF och KFÖ med Närvarande räknas).</div>
        <div style="height:8px;background:#E3ECFA;border-radius:4px;margin-top:8px;overflow:hidden;"><div style="height:100%;width:${Math.min(100,Math.round(100*done/GRUNDUTB_KRAV))}%;background:#1F5FBF;"></div></div>
        ${done>=GRUNDUTB_KRAV ? `<p style="margin-top:8px;font-size:12px;color:var(--ink-soft);">Kravet är uppfyllt — notera notisen på startsidan för att avsluta grundutbildningen.</p>` : ''}
      </div>`
    : (p.grundutbKlar ? `<div class="panel" style="margin-bottom:14px;font-size:13px;">Grundutbildning klar (${GRUNDUTB_KRAV} avtalsövningar genomförda som blåbandare).</div>` : '');
  return `${traineePanel}<div class="panel" style="margin-bottom:14px;">
    <label style="font-weight:600;display:block;margin-bottom:6px;">Avtalsår uppfyllda innan ${YEAR_START}</label>
    <input type="number" min="0" step="1" style="width:100px;" value="${p.avtalsarInnanStart||0}" onchange="setAvtalsarInnanStart('${p.id}', this.value)">
    <p style="margin-top:8px;color:var(--ink-soft);font-size:12px;">Antal avtalsår personen redan uppfyllt innan registret började följa övningar. Räknas med i personens totala uppfyllda avtalsår, som används i statistiken och vid beräkning av vilken grad personen uppfyller.</p>
    <label style="font-weight:600;display:block;margin:14px 0 6px;">Stf PlutC/PlutC sedan år</label>
    <input type="number" step="1" style="width:100px;" placeholder="—" value="${p.plutcSedanAr||''}" onchange="setPlutcSedanAr('${p.id}', this.value)">
    <p style="margin-top:8px;color:var(--ink-soft);font-size:12px;">Det år personen tillträdde som Stf PlutC eller PlutC (vilket som var först). Används för att räkna ut om kravet på två uppfyllda avtalsår <em>i befattningen</em> Stf PlutC/PlutC är uppfyllt — till skillnad från övriga avtalsårskrav räknas inte totalt uppfyllda avtalsår i karriären, bara år från och med detta år. Krävs för graden Löjtnant.</p>
  </div>
  <div class="panel">
    <table class="exercise">
      <thead><tr><th>År</th>${EXERCISE_TYPES.map(t=>`<th>${t.label}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p style="margin-top:14px;color:var(--ink-soft);font-size:12px;">Ett år markeras grönt när båda övningarna är genomförda. Se <a onclick="goOverview()">Övningsöversikten</a> för mönster över samtliga personer.</p>
    <div style="margin-top:10px;"><button class="btn small" onclick="addYear()">+ Lägg till år (${YEARS[YEARS.length-1]+1})</button></div>
  </div>`;
}
function setAvtalsarInnanStart(pid, val){
  const p = DATA.persons.find(x=>x.id===pid);
  if(!p) return;
  p.avtalsarInnanStart = Math.max(0, parseInt(val,10)||0);
  saveToDisk(); renderAll();
}
function setPlutcSedanAr(pid, val){
  const p = DATA.persons.find(x=>x.id===pid);
  if(!p) return;
  const n = parseInt(val,10);
  p.plutcSedanAr = (val==='' || isNaN(n)) ? '' : n;
  saveToDisk(); renderAll();
}
function toggleExerciseStatus(pid, year, typeKey, status){
  const p = DATA.persons.find(x=>x.id===pid);
  const cur = p.ovningar[year][typeKey];
  if(cur.status===status){ cur.status=null; }
  else { cur.status=status; if(status==='narvarande') cur.anledning=''; }
  saveToDisk(); renderAll();
}
function setExerciseReason(pid, year, typeKey, val){
  const p = DATA.persons.find(x=>x.id===pid);
  p.ovningar[year][typeKey].anledning = val;
  saveToDisk();
}

function renderPlan(p){
  const blocks = YEARS.map(y=>`<div class="plan-year">
      <label>${y}</label>
      <textarea onblur="setPlan('${p.id}',${y},this.value)" placeholder="Utvecklingsmål och anteckningar för ${y}…">${esc(p.utvecklingsplan[y])}</textarea>
    </div>`).join('');
  return `<div class="panel">
    ${blocks}
    <div style="margin-top:4px;"><button class="btn small" onclick="addYear()">+ Lägg till år (${YEARS[YEARS.length-1]+1})</button></div>
  </div>`;
}
function setPlan(pid, year, val){
  const p = DATA.persons.find(x=>x.id===pid);
  p.utvecklingsplan[year] = val;
  saveToDisk();
}

/* ---------- exercise overview matrix ---------- */
function renderOverview(){
  const people = DATA.persons
    .filter(p=>groupKind(p.groupId)!=='recruit' || isTrainee(p))
    .slice()
    .sort((a,b)=>{
      const ga = groupName(a.groupId), gb = groupName(b.groupId);
      if(ga!==gb) return ga.localeCompare(gb,'sv');
      return (a.sortIndex||0)-(b.sortIndex||0);
    });
  const totalCols = YEARS.length * EXERCISE_TYPES.length;
  const headYears = YEARS.map(y=>`<th colspan="${EXERCISE_TYPES.length}">${y}</th>`).join('');
  const headTypes = YEARS.map(()=>EXERCISE_TYPES.map(t=>`<th>${t.label}</th>`).join('')).join('');

  const rows = people.map(p=>{
    let attended=0, markedYears=0, yearShareSum=0;
    YEARS.forEach(y=>{
      const sts = EXERCISE_TYPES.map(t=>p.ovningar[y][t.key].status);
      if(!sts.some(st=>st)) return; // år helt utan markeringar räknas inte
      markedYears++;
      if(sts.every(st=>st==='narvarande')) yearShareSum++; // uppfyllt år = både SÖF och KFÖ genomförda
    });
    const cellsArr = YEARS.map(y=>{
      const yearOk = EXERCISE_TYPES.every(t=>p.ovningar[y][t.key].status==='narvarande');
      return EXERCISE_TYPES.map(t=>{
        const st = p.ovningar[y][t.key];
        let cls='no', sym='—', title='';
        if(st.status==='narvarande'){ cls='yes'+(yearOk?' yearOk':''); sym='●'; attended++; }
        else if(st.status==='franvarande'){ cls='absent'; sym='✕'; title = st.anledning?` title="${esc(st.anledning)}"`:''; }
        return `<td class="${cls}"${title}>${sym}</td>`;
      }).join('');
    }).join('');
    const pct = markedYears ? Math.round(100*yearShareSum/markedYears) : null;
    const pctClass = pct==null ? '' : (pct<40?'low':(pct<75?'mid':'high'));
    return `<tr>
      <td class="name" onclick="goPerson('${p.id}','ovningar')" style="cursor:pointer;"><span class="${isTrainee(p)?'trainee':''}">${esc(fullName(p))}</span><div style="font-weight:400;color:var(--ink-faint);">${esc(groupName(p.groupId))}</div></td>
      ${cellsArr}
      <td class="pct ${pctClass}" title="${markedYears ? Math.round(yearShareSum)+' av '+markedYears+' markerade år uppfyllda' : 'Inga markerade år'}">${pct==null ? '–' : pct+'%'}</td>
    </tr>`;
  }).join('');

  if(!people.length){
    return `<div class="crumbs"><a onclick="goHome()">Startsida</a> / Övningsöversikt</div>
      <div class="viewhead"><h2>Övningsöversikt</h2></div>
      <div class="empty-state">Ingen personal med övningskrav registrerad ännu.</div>`;
  }

  return `
    <div class="crumbs"><a onclick="goHome()">Startsida</a> / Övningsöversikt</div>
    <div class="viewhead">
      <div><h2>Övningsöversikt</h2><div class="sub">SÖF och KFÖ, ${YEAR_START}–${YEAR_END}. Grönt år = båda övningarna genomförda. Röd kryss = frånvaro (håll muspekaren över för anledning). Personal i rekryteringsgruppen ingår inte, utom blåbandare (blå text). Andel = uppfyllda år (både SÖF och KFÖ genomförda) av de år som har markeringar; år helt utan markeringar räknas inte.</div></div>
    </div>
    <div class="ov-wrap">
      <table class="matrix">
        <thead>
          <tr><th rowspan="2" style="position:sticky;left:0;background:#FAF9F5;">Namn</th>${headYears}<th rowspan="2">Andel</th></tr>
          <tr>${headTypes}</tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

/* ---------- grade (grad) overview ---------- */
function renderGradOverview(){
  const people = DATA.persons
    .slice()
    .sort((a,b)=>{
      const ga = groupName(a.groupId), gb = groupName(b.groupId);
      if(ga!==gb) return ga.localeCompare(gb,'sv');
      return (a.sortIndex||0)-(b.sortIndex||0);
    });

  if(!people.length){
    return `<div class="crumbs"><a onclick="goHome()">Startsida</a> / Grader</div>
      <div class="viewhead"><h2>Grader</h2></div>
      <div class="empty-state">Ingen personal registrerad ännu.</div>`;
  }

  const rows = people.map(p=>{
    const cur = currentGrade(p);
    const curLevel = cur ? cur.level : 0;
    const nextDef = GRADES.find(d=>d.level===curLevel+1);
    let nextCell, missingCell;
    if(nextDef){
      const missing = missingForGrade(nextDef, p);
      nextCell = esc(nextDef.label);
      missingCell = missing.length
        ? missing.map(m=>esc(m)).join('<br>')
        : `<span class="pill ok">Uppfyllt</span>`;
    } else {
      nextCell = '—';
      missingCell = `<span style="color:var(--ink-faint);">${cur ? 'Högsta graden uppnådd' : 'Uppfyller inga gradkrav ännu'}</span>`;
    }
    return `<tr>
      <td onclick="goPerson('${p.id}')" style="cursor:pointer;white-space:nowrap;">${nameStrong(p, fullName(p))}</td>
      <td style="white-space:nowrap;">${esc(groupName(p.groupId))}</td>
      <td style="white-space:nowrap;">${esc(personBefattningDisplay(p)||'—')}</td>
      <td style="white-space:nowrap;">${cur ? esc(cur.label) : '<span style="color:var(--ink-faint);">Ingen grad</span>'}</td>
      <td style="white-space:nowrap;">${nextCell}</td>
      <td style="font-size:12px;">${missingCell}</td>
    </tr>`;
  }).join('');

  return `
    <div class="crumbs"><a onclick="goHome()">Startsida</a> / Grader</div>
    <div class="viewhead">
      <div><h2>Grader</h2><div class="sub">Beräknad grad utifrån befattning, kompetenser och uppfyllda avtalsår. Nya kvalificeringar flaggas automatiskt i notisrutan på startsidan tills de noteras.</div></div>
    </div>
    <div class="ov-wrap">
      <table class="gradeTable">
        <thead><tr><th>Namn</th><th>Grupp</th><th>Befattning</th><th>Nuvarande grad</th><th>Nästa grad</th><th>Vad som återstår</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

/* ---------- platoon statistics ---------- */
function statGoalRow(key, label, current){
  const mal = DATA.mal || {};
  const goal = (mal[key]===undefined || mal[key]===null) ? null : mal[key];
  const need = goal==null ? null : Math.max(0, goal-current);
  const reached = goal!=null && current>=goal;
  return `<tr>
    <td>${esc(label)}</td>
    <td>${current}</td>
    <td><input type="number" min="0" value="${goal!=null?goal:''}" placeholder="—" onchange="setGoal('${key}', this.value)"></td>
    <td class="${goal==null?'':(reached?'pctgood':'pctneed')}">${goal==null ? '–' : (reached ? 'Målet nått' : need+' behövs')}</td>
  </tr>`;
}
function setGoal(key, val){
  if(!DATA.mal) DATA.mal = {};
  DATA.mal[key] = (val==='' || val==null) ? null : Math.max(0, parseInt(val,10)||0);
  saveToDisk(); renderAll();
}
function renderStats(){
  const inPluton = DATA.persons.filter(p=>groupKind(p.groupId)==='standard');
  const total = inPluton.length;
  const isChefBefattning = (b)=>{
    const t = (b||'').trim().toLowerCase();
    return t==='grpc' || t==='stf grpc';
  };
  const chefCount = inPluton.filter(p=>isChefBefattning(personBefattning(p))).length;
  const soldatCount = inPluton.filter(p=>{
    const t = (personBefattning(p)||'').trim().toLowerCase();
    return t!=='grpc' && t!=='stf grpc' && t!=='plutc' && t!=='stf plutc';
  }).length;

  const overviewRows = [
    statGoalRow('personal','Antal personal', total),
    statGoalRow('chef','Antal GrpC (inkl. Stf GrpC)', chefCount),
    statGoalRow('soldat','Antal soldater', soldatCount),
  ].join('');

  const statCompetencies = DATA.competencies.filter(c=>c.showInStats);
  const compRows = statCompetencies.map(c=>{
    const count = inPluton.filter(p=>p.kompetenser[c.id] && p.kompetenser[c.id].has).length;
    return statGoalRow('komp_'+c.id, c.label, count);
  }).join('');
  const compSection = statCompetencies.length
    ? `<table class="full stats" style="min-width:0;">
        <thead><tr><th>Kompetens</th><th>Nuvarande</th><th>Mål</th><th>Behov</th></tr></thead>
        <tbody>${compRows}</tbody>
      </table>`
    : `<p style="color:var(--ink-faint);font-style:italic;">Ingen kompetens är markerad för att visas i statistiken än. Kryssa i "Visa i statistik" på en kompetens i en persons kompetensflik.</p>`;

  return `
    <div class="crumbs"><a onclick="goHome()">Startsida</a> / Statistik</div>
    <div class="viewhead">
      <div><h2>Plutonens statistik</h2><div class="sub">Baseras på personal i grupp 1–6 (rekrytering och avveckling räknas inte med). Ange ett mål i respektive kategori för att se vad som saknas.</div></div>
    </div>
    <div class="panel" style="margin-bottom:18px;">
      <table class="full stats" style="min-width:0;">
        <thead><tr><th>Kategori</th><th>Nuvarande</th><th>Mål</th><th>Behov</th></tr></thead>
        <tbody>${overviewRows}</tbody>
      </table>
      <p style="margin-top:12px;color:var(--ink-soft);font-size:12px;">"Antal GrpC" räknar inte PlutC och Stf PlutC — de tillhör plutonsledningen, inte en enskild grupp.</p>
    </div>
    <div class="panel" style="margin-bottom:18px;">
      <h3 style="font-size:15px;margin-bottom:12px;">Kompetenser</h3>
      ${compSection}
      <p style="margin-top:12px;color:var(--ink-soft);font-size:12px;">Endast kompetenser markerade "Visa i statistik" räknas här — det gäller både grundkompetenserna och egna tillagda.</p>
    </div>
    ${renderContractFulfillment(inPluton)}
  `;
}

function renderContractFulfillment(inPluton){

/* ---------- init ---------- */
/* =========================================================================
   PIN-LÅS OCH KRYPTERING
   - Användaren väljer en egen 6-siffrig PIN-kod.
   - En nyckel tas fram ur PIN-koden med PBKDF2 (SHA-256, många varv, eget
     slumpat salt per enhet) och används för AES-GCM-kryptering av allt
     registret sparar: i appen (telefon/iPhone), i mappen (dator) och i
     säkerhetskopior (Exportera JSON).
   - PIN-koden och nyckeln finns bara i minnet medan appen är upplåst.
   - Inget går att återställa utan PIN-koden.
   ========================================================================= */
const LS_VAULT = 'personalregister_vault';
const LS_PIN_FAIL = 'personalregister_pinfail';
const ENC_TAG = 'PR-ENC-1';
const PBKDF2_ITER = 600000;
const PIN_LEN = 6;
const AUTOLOCK_BG_MS = 5*60*1000;     // låses efter 5 min i bakgrunden
const AUTOLOCK_IDLE_MS = 15*60*1000;  // låses efter 15 min utan aktivitet
let vaultKey = null, vaultSalt = null, currentPin = null;
const derivedKeyCache = new Map();

function cryptoAvailable(){ return !!(window.crypto && crypto.subtle && window.isSecureContext); }
function bytesToB64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function b64ToU8(b64){ const s=atob(b64); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function deriveKey(pin, saltU8, iter){
  const cacheKey = pin+'|'+bytesToB64(saltU8)+'|'+iter;
  if(derivedKeyCache.has(cacheKey)) return derivedKeyCache.get(cacheKey);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:saltU8, iterations:iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  derivedKeyCache.set(cacheKey, key);
  return key;
}
async function encryptWith(key, saltU8, iter, text){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text)));
  return JSON.stringify({format:ENC_TAG, app:'Personalregister', salt:bytesToB64(saltU8), iter, iv:bytesToB64(iv), data:bytesToB64(ct)});
}
async function decryptWith(key, env){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToU8(env.iv)}, key, b64ToU8(env.data));
  return new TextDecoder().decode(pt);
}
function parseEnvelope(raw){
  if(typeof raw!=='string' || raw.indexOf(ENC_TAG)<0) return null;
  try{ const o = JSON.parse(raw); return (o && o.format===ENC_TAG) ? o : null; }catch(e){ return null; }
}
function isEncryptedPayload(raw){ return !!parseEnvelope(raw); }
async function encryptForStorage(text){
  if(!vaultKey) throw new Error('Appen är låst.');
  return encryptWith(vaultKey, vaultSalt, PBKDF2_ITER, text);
}
/* Okrypterad (gammal) data släpps igenom och krypteras vid nästa sparning.
   Krypterad data med annat salt (t.ex. en säkerhetskopia från en annan
   enhet) provas först med nuvarande PIN, annars frågas efter PIN-koden. */
async function decryptFromStorage(raw, askIfNeeded){
  const env = parseEnvelope(raw);
  if(!env) return raw;
  const salt = b64ToU8(env.salt);
  const iter = env.iter || PBKDF2_ITER;
  try{
    const key = (vaultSalt && env.salt===bytesToB64(vaultSalt) && iter===PBKDF2_ITER) ? vaultKey : await deriveKey(currentPin, salt, iter);
    return await decryptWith(key, env);
  }catch(e){
    if(!askIfNeeded) throw new Error('fel PIN-kod eller skadad fil');
  }
  for(let tries=0; tries<3; tries++){
    const pin = await askPinModal('Säkerhetskopian är låst med en annan PIN-kod. Ange den PIN-kod som gällde när den gjordes.');
    if(pin==null) throw new Error('avbrutet');
    try{ return await decryptWith(await deriveKey(pin, salt, iter), env); }catch(e){ /* försök igen */ }
  }
  throw new Error('fel PIN-kod');
}
function loadVault(){ try{ return JSON.parse(localStorage.getItem(LS_VAULT)); }catch(e){ return null; } }
function saveVault(v){ localStorage.setItem(LS_VAULT, JSON.stringify(v)); }

/* ---- felaktiga försök: ökande väntetid ---- */
function pinFailState(){ try{ return JSON.parse(localStorage.getItem(LS_PIN_FAIL)) || {n:0, until:0}; }catch(e){ return {n:0, until:0}; } }
function registerPinFail(){
  const st = pinFailState(); st.n++;
  if(st.n>=5){ const secs = Math.min(15*60, 30*Math.pow(2, st.n-5)); st.until = Date.now()+secs*1000; }
  try{ localStorage.setItem(LS_PIN_FAIL, JSON.stringify(st)); }catch(e){}
  return st;
}
function clearPinFail(){ try{ localStorage.removeItem(LS_PIN_FAIL); }catch(e){} }

/* ---- låsskärm med sifferknappar ---- */
let lockMode = null;   // 'unlock' | 'create' | 'confirm' | 'change-old' | 'change-new' | 'change-confirm'
let pinEntry = '', pinFirst = '', lockBusy = false, lockTimer = null;
function lockLogo(){ const l = document.getElementById('headerLogo'); return l ? l.src : ''; }
function showLockScreen(mode, msg, isErr){
  lockMode = mode; pinEntry = '';
  document.body.classList.add('locked');
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
  let el = document.getElementById('lockScreen');
  if(!el){ el = document.createElement('div'); el.id='lockScreen'; document.body.appendChild(el); }
  const titles = {
    'unlock':'Ange PIN-kod', 'create':'Välj en PIN-kod', 'confirm':'Upprepa PIN-koden',
    'change-old':'Ange nuvarande PIN-kod', 'change-new':'Välj ny PIN-kod', 'change-confirm':'Upprepa nya PIN-koden'
  };
  const defaultMsg = {
    'unlock':'Registret är låst.',
    'create':'Välj sex siffror som du kommer ihåg. Registret krypteras med koden.',
    'confirm':'Skriv samma sex siffror en gång till.',
    'change-old':'För att byta PIN-kod.',
    'change-new':'Välj sex nya siffror.',
    'change-confirm':'Skriv de nya siffrorna en gång till.'
  };
  const cancelable = mode.startsWith('change');
  el.innerHTML = `<div class="lockBox">
    ${lockLogo() ? `<img src="${lockLogo()}" alt="">` : ''}
    <h2>${titles[mode]}</h2>
    <div class="lockMsg ${isErr?'err':''}" id="lockMsg">${esc(msg || defaultMsg[mode])}</div>
    <div class="pinDots" id="pinDots">${'<span></span>'.repeat(PIN_LEN)}</div>
    <div class="pinPad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" onclick="pinPress('${n}')">${n}</button>`).join('')}
      ${cancelable ? `<button type="button" class="fn" onclick="cancelChangePin()">Avbryt</button>` : '<span></span>'}
      <button type="button" onclick="pinPress('0')">0</button>
      <button type="button" class="fn" onclick="pinBack()" aria-label="Radera">⌫</button>
    </div>
    ${mode==='unlock' ? `<button type="button" class="lockLink" onclick="forgotPin()">Glömt PIN-koden?</button>` : ''}
    ${mode==='create' ? `<div class="lockNote">PIN-koden kan inte återställas. Glömmer du den måste registret läsas in igen från en säkerhetskopia eller via Slack-text.</div>` : ''}
  </div>`;
  updatePinDots();
  checkLockout();
}
function hideLockScreen(){
  const el = document.getElementById('lockScreen'); if(el) el.remove();
  document.body.classList.remove('locked');
  lockMode = null; pinEntry = ''; pinFirst = '';
}
function updatePinDots(){
  const d = document.getElementById('pinDots'); if(!d) return;
  [...d.children].forEach((s,i)=>s.classList.toggle('on', i<pinEntry.length));
}
function setLockMsg(msg, isErr){
  const m = document.getElementById('lockMsg'); if(!m) return;
  m.textContent = msg; m.classList.toggle('err', !!isErr);
}
function setPadDisabled(dis){ document.querySelectorAll('.pinPad button').forEach(b=>b.disabled = dis); }
function checkLockout(){
  if(lockMode!=='unlock' && lockMode!=='change-old') return false;
  const st = pinFailState();
  const left = Math.ceil((st.until - Date.now())/1000);
  if(left>0){
    setPadDisabled(true);
    setLockMsg(`För många felaktiga försök. Vänta ${left} s.`, true);
    clearTimeout(lockTimer);
    lockTimer = setTimeout(checkLockout, 1000);
    return true;
  }
  setPadDisabled(false);
  return false;
}
function pinBack(){ if(lockBusy) return; pinEntry = pinEntry.slice(0,-1); updatePinDots(); }
function pinPress(d){
  if(lockBusy || pinEntry.length>=PIN_LEN || checkLockout()) return;
  pinEntry += d; updatePinDots();
  if(pinEntry.length===PIN_LEN) setTimeout(()=>submitPin(pinEntry), 120);
}
document.addEventListener('keydown', e=>{
  if(!lockMode) return;
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); pinPress(e.key); }
  else if(e.key==='Backspace'){ e.preventDefault(); pinBack(); }
});
function weakPin(pin){
  if(/^(\d)\1{5}$/.test(pin)) return true;                  // 111111
  if('0123456789012'.includes(pin) || '9876543210987'.includes(pin)) return true; // 123456, 654321
  return false;
}
async function submitPin(pin){
  pinEntry = ''; updatePinDots();
  if(lockMode==='create' || lockMode==='change-new'){
    if(weakPin(pin)){ setLockMsg('För enkel kod (t.ex. 123456 eller 111111). Välj en annan.', true); return; }
    pinFirst = pin;
    showLockScreen(lockMode==='create' ? 'confirm' : 'change-confirm');
    return;
  }
  if(lockMode==='confirm' || lockMode==='change-confirm'){
    if(pin!==pinFirst){
      showLockScreen(lockMode==='confirm' ? 'create' : 'change-new', 'Koderna stämde inte överens. Försök igen.', true);
      return;
    }
    lockBusy = true; setLockMsg('Krypterar registret…');
    try{
      if(lockMode==='confirm') await createVault(pin);
      else await changeVaultPin(pin);
    }catch(e){
      lockBusy = false;
      showLockScreen(lockMode==='confirm' ? 'create' : 'change-new', 'Något gick fel: '+(e.message||e), true);
      return;
    }
    lockBusy = false;
    const wasChange = lockMode==='change-confirm';
    hideLockScreen();
    if(wasChange){ renderAll(); alert('PIN-koden är bytt.'); }
    else await afterUnlock();
    return;
  }
  if(lockMode==='unlock' || lockMode==='change-old'){
    lockBusy = true; setLockMsg('Kontrollerar…');
    const ok = await tryPin(pin);
    lockBusy = false;
    if(!ok){
      const st = registerPinFail();
      if(!checkLockout()) setLockMsg(`Fel PIN-kod.${st.n>=3 ? ' ('+st.n+' felaktiga försök)' : ''}`, true);
      return;
    }
    clearPinFail();
    if(lockMode==='change-old'){ showLockScreen('change-new'); return; }
    hideLockScreen();
    await afterUnlock();
  }
}
async function tryPin(pin){
  const v = loadVault(); if(!v) return false;
  try{
    const salt = b64ToU8(v.salt);
    const key = await deriveKey(pin, salt, v.iter||PBKDF2_ITER);
    const check = await decryptWith(key, v.check);
    if(check!=='personalregister-ok') return false;
    vaultKey = key; vaultSalt = salt; currentPin = pin;
    return true;
  }catch(e){ return false; }
}
async function createVault(pin){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pin, salt, PBKDF2_ITER);
  const check = JSON.parse(await encryptWith(key, salt, PBKDF2_ITER, 'personalregister-ok'));
  saveVault({v:1, salt:bytesToB64(salt), iter:PBKDF2_ITER, check});
  vaultKey = key; vaultSalt = salt; currentPin = pin;
  await reencryptLocalRegisters(null);  // kryptera ev. gamla okrypterade register
}
/* Kryptera om alla register i appen (och i vald mapp) med nuvarande nyckel.
   oldPin används för att öppna data som är krypterad med en tidigare kod. */
async function reencryptLocalRegisters(oldPin){
  const open = async raw=>{
    const env = parseEnvelope(raw);
    if(!env) return raw;
    return decryptWith(await deriveKey(oldPin||currentPin, b64ToU8(env.salt), env.iter||PBKDF2_ITER), env);
  };
  try{
    const rawShare = localStorage.getItem(LS_SHARE);
    if(rawShare) localStorage.setItem(LS_SHARE, await encryptForStorage(await open(rawShare)));
  }catch(e){ localStorage.removeItem(LS_SHARE); }
  for(const r of lsLoadRegistry()){
    const raw = localStorage.getItem(LS_PREFIX+r.key);
    if(!raw) continue;
    try{ localStorage.setItem(LS_PREFIX+r.key, await encryptForStorage(await open(raw))); }
    catch(e){ console.warn('Kunde inte kryptera om', r.key, e); }
  }
}
async function changeVaultPin(newPin){
  const oldPin = currentPin;
  await saveChain;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(newPin, salt, PBKDF2_ITER);
  const check = JSON.parse(await encryptWith(key, salt, PBKDF2_ITER, 'personalregister-ok'));
  const prev = {key:vaultKey, salt:vaultSalt, pin:currentPin, vault:loadVault()};
  vaultKey = key; vaultSalt = salt; currentPin = newPin;
  try{
    await reencryptLocalRegisters(oldPin);
    saveVault({v:1, salt:bytesToB64(salt), iter:PBKDF2_ITER, check});
  }catch(e){
    vaultKey = prev.key; vaultSalt = prev.salt; currentPin = prev.pin;
    throw e;
  }
  if(DATA) await saveToDisk();
}
function startChangePin(){ toggleMenu(false); pinFirst=''; showLockScreen('change-old'); }
function cancelChangePin(){ hideLockScreen(); renderAll(); }
function forgotPin(){
  if(!confirm('PIN-koden kan inte återställas.\n\nVill du radera ALLA register på den här enheten och börja om med en ny PIN-kod? Du kan sedan läsa in en säkerhetskopia eller importera från Slack-text.')) return;
  if(!confirm('Är du helt säker? Alla register i appen på den här enheten raderas.')) return;
  try{
    Object.keys(localStorage).filter(k=>k.startsWith('personalregister_')).forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  vaultKey = null; vaultSalt = null; currentPin = null; derivedKeyCache.clear();
  DATA = null; currentFileName = null; registerList = [];
  showLockScreen('create', 'Välj en ny PIN-kod.');
}
async function lockApp(){
  if(!loadVault()) return;
  toggleMenu(false);
  try{ await saveChain; }catch(e){}
  vaultKey = null; vaultSalt = null; currentPin = null; derivedKeyCache.clear();
  DATA = null;

async function afterUnlock(){

['pointerdown','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev, ()=>{ lastActivity = Date.now(); }, {passive:true}));

/* =========================================================================
   DELNINGSKOD — krypterade exporttexter för Slack m.fl.
   Texten komprimeras och krypteras (AES-256-GCM, nyckel från delningskoden
   via PBKDF2). Mottagaren läser in den i sin app med samma delningskod,
   oberoende av sin egen PIN-kod. Delningskoden kan sparas på enheten,
   krypterad med användarens PIN-kod.
   ========================================================================= */
const SHARE_TAG = 'PRX1.';
const SHARE_MIN_LEN = 8;
const LS_SHARE = 'personalregister_sharecode';
const SLACK_SAFE_LEN = 35000;
async function compressBytes(u8){
  if(typeof CompressionStream==='undefined') return null;
  const cs = new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(cs).arrayBuffer());
}
async function decompressBytes(u8){
  const ds = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(ds).arrayBuffer());
}
async function encryptShared(text, code){
  const plain = new TextEncoder().encode(text);
  const packed = await compressBytes(plain);
  const flag = packed ? 1 : 0;
  const body = packed || plain;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(code, salt, PBKDF2_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, body));
  const out = new Uint8Array(2+16+12+ct.length);
  out[0]=1; out[1]=flag; out.set(salt,2); out.set(iv,18); out.set(ct,30);
  return SHARE_TAG + bytesToB64(out);
}
function extractShared(text){
  const i = (text||'').indexOf(SHARE_TAG);
  if(i<0) return null;
  const rest = text.slice(i+SHARE_TAG.length);
  const m = rest.match(/^[A-Za-z0-9+\/=\s]+/);
  return m ? m[0].replace(/\s+/g,'') : null;
}
async function decryptShared(b64, code){
  const all = b64ToU8(b64);
  if(all[0]!==1) throw new Error('okänt format — uppdatera appen');
  const salt = all.slice(2,18), iv = all.slice(18,30), ct = all.slice(30);
  const key = await deriveKey(code, salt, PBKDF2_ITER);
  let body;
  try{ body = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct)); }
  catch(e){ throw new Error('fel delningskod'); }
  if(all[1]===1){
    if(typeof DecompressionStream==='undefined') throw new Error('appen/webbläsaren är för gammal för att packa upp texten');
    body = await decompressBytes(body);
  }
  return new TextDecoder().decode(body);
}
async function getRememberedShareCode(){
  try{ const raw = localStorage.getItem(LS_SHARE); return raw ? await decryptFromStorage(raw) : ''; }catch(e){ return ''; }
}
async function setRememberedShareCode(code){
  try{
    if(code) localStorage.setItem(LS_SHARE, await encryptForStorage(code));
    else localStorage.removeItem(LS_SHARE);
  }catch(e){}
}
/* Om texten är krypterad: prova sparad delningskod, annars fråga.
   Okrypterad text släpps igenom oförändrad. */
async function openSharedText(text){
  const b64 = extractShared(text);
  if(!b64) return text;
  const saved = await getRememberedShareCode();
  if(saved){ try{ return await decryptShared(b64, saved); }catch(e){ /* fråga nedan */ } }
  let msg = saved ? 'Den sparade delningskoden passade inte. Ange delningskoden som användes för den här exporten.' : 'Texten är krypterad. Ange delningskoden du fått av avsändaren.';
  for(let tries=0; tries<5; tries++){
    const r = await askShareCodeModal(msg);
    if(!r) throw new Error('avbrutet');
    try{
      const out = await decryptShared(b64, r.code);
      if(r.remember) await setRememberedShareCode(r.code);
      return out;
    }catch(e){ msg = (e.message==='fel delningskod') ? 'Fel delningskod. Försök igen.' : ('Kunde inte läsa texten: '+e.message); }
  }
  throw new Error('fel delningskod');
}
function askShareCodeModal(text){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'overlay'; overlay.style.zIndex = 250;
    overlay.innerHTML = `<div class="modal" style="max-width:420px;">
      <h3>Delningskod</h3>
      <p style="color:var(--ink-soft);font-size:13px;">${esc(text)}</p>
      <div class="field"><input id="shareCodeIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <label class="checkwrap" style="margin-top:8px;font-size:13px;"><input type="checkbox" onchange="document.getElementById('shareCodeIn').type=this.checked?'text':'password'"> Visa koden</label>
      <label class="checkwrap" style="margin-top:6px;font-size:13px;"><input type="checkbox" id="shareCodeRem" checked> Kom ihåg koden på den här enheten</label>
      <div class="modal-actions">
        <button class="btn" id="shareCancel">Avbryt</button>

    document.body.appendChild(overlay);

    inp.onkeydown = e=>{ if(e.key==='Enter') overlay.querySelector('#shareOk').click(); };
    setTimeout(()=>inp.focus(), 0);
  });
}
/* ---- exportflödet ---- */
