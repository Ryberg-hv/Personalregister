    <p style="color:var(--ink-soft);font-size:13px;margin-bottom:12px;">Välj en delningskod (minst ${SHARE_MIN_LEN} tecken, gärna några ord). Mottagaren behöver samma kod för att läsa in texten. Skicka <strong>inte</strong> koden i Slack — lämna den muntligt eller på annat säkert sätt.</p>
    <div class="formgrid">
      <div class="field full"><label>Delningskod</label><input id="shareCode" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(saved)}"></div>
      <div class="field full"><label>Upprepa delningskoden</label><input id="shareCode2" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(saved)}"></div>
    </div>
    <label class="checkwrap" style="margin-top:10px;font-size:13px;"><input type="checkbox" onchange="['shareCode','shareCode2'].forEach(id=>document.getElementById(id).type=this.checked?'text':'password')"> Visa koden</label>
    <label class="checkwrap" style="margin-top:6px;font-size:13px;"><input type="checkbox" id="shareRemember" checked> Kom ihåg koden på den här enheten</label>
    <div id="shareMsg" style="color:var(--danger);font-size:13px;min-height:18px;margin-top:8px;"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Avbryt</button>
      <button class="btn primary" id="shareGoBtn" onclick="runShareExport()">Kryptera</button>
    </div>`;
  setTimeout(()=>{ const i=document.getElementById(saved?'shareGoBtn':'shareCode'); if(i) i.focus(); },0);
}
async function runShareExport(){
  const c1 = document.getElementById('shareCode').value, c2 = document.getElementById('shareCode2').value;
  const msg = document.getElementById('shareMsg');
  if(c1.length < SHARE_MIN_LEN){ msg.textContent = `Delningskoden måste vara minst ${SHARE_MIN_LEN} tecken.`; return; }
  if(c1!==c2){ msg.textContent = 'Koderna stämmer inte överens.'; return; }
  const btn = document.getElementById('shareGoBtn'); btn.disabled = true; btn.textContent = 'Krypterar…'; msg.textContent='';
  let blob;
  try{ blob = await encryptShared(shareExportState.plain, c1); }
  catch(e){ msg.textContent = 'Kunde inte kryptera: '+(e.message||e); btn.disabled=false; btn.textContent='Kryptera'; return; }
  if(document.getElementById('shareRemember').checked) await setRememberedShareCode(c1);
  else await setRememberedShareCode('');
  const lines = blob.match(/.{1,76}/g).join('\n');
  const text = `🔒 Personalregister – krypterad export (${shareExportState.title}). Läs in i appen med delningskoden.\n\`\`\`\n${lines}\n\`\`\``;
  shareExportState.text = text;
  const tooLong = text.length > SLACK_SAFE_LEN;
  const modal = document.querySelector('.overlay .modal');
  modal.innerHTML = `
    <h3>Klart att skicka</h3>
    <p style="color:var(--ink-soft);font-size:13px;margin-bottom:10px;">Texten är krypterad (${text.length.toLocaleString('sv-SE')} tecken). Klistra in den i Slack; mottagaren väljer <strong>Importera från Slack</strong> i gruppen eller <strong>Importera personal → Hela plutonen</strong> och anger delningskoden.</p>
    ${tooLong ? `<div class="banner" style="margin-bottom:10px;">Texten är lång och kan bli för lång för ett Slack-meddelande. Använd <strong>Spara som fil</strong> och skicka filen i Slack i stället — mottagaren kan välja filen i importdialogen.</div>` : ''}
    <textarea readonly style="width:100%;height:140px;font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px;">${esc(text)}</textarea>
    <div class="modal-actions" style="justify-content:flex-start;flex-wrap:wrap;">
      <button class="btn primary" onclick="copyShareText(this)">Kopiera</button>
      ${navigator.share ? `<button class="btn" onclick="navigator.share({text: shareExportState.text}).catch(()=>{})">Dela…</button>` : ''}
      <button class="btn" onclick="deliverFile(new Blob([shareExportState.text],{type:'text/plain;charset=utf-8'}), 'personalregister-'+slugify(shareExportState.title)+'.txt')">Spara som fil</button>
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Stäng</button></div>`;
}
function copyShareText(btn){
  if(!shareExportState || !shareExportState.text) return;
  copyToClipboard(shareExportState.text).then(()=>btnFeedback(btn)).catch(()=>{
    const ta = document.querySelector('.overlay textarea'); if(ta){ ta.focus(); ta.select(); }
    alert('Kunde inte kopiera automatiskt — texten är markerad, kopiera den manuellt.');
  });
}

/* ---- liten PIN-dialog (för säkerhetskopior låsta med annan kod) ---- */
function askPinModal(text){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'overlay'; overlay.style.zIndex = 250;
    overlay.innerHTML = `<div class="modal" style="max-width:380px;">
      <h3>Ange PIN-kod</h3>
      <p style="color:var(--ink-soft);font-size:13px;">${esc(text)}</p>
      <div class="field"><input id="askPinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" style="font-size:22px;letter-spacing:.4em;text-align:center;"></div>
      <div class="modal-actions">
        <button class="btn" id="askPinCancel">Avbryt</button>
        <button class="btn primary" id="askPinOk">Lås upp</button>
      </div></div>`;
    document.body.appendChild(overlay);
    const inp = overlay.querySelector('#askPinInput');
    const done = v=>{ overlay.remove(); resolve(v); };
    overlay.querySelector('#askPinCancel').onclick = ()=>done(null);
    overlay.querySelector('#askPinOk').onclick = ()=>{ if(/^\d{6}$/.test(inp.value)) done(inp.value); else inp.focus(); };
    inp.onkeydown = e=>{ if(e.key==='Enter') overlay.querySelector('#askPinOk').click(); };
    setTimeout(()=>inp.focus(), 0);
  });
}

function init(){
  if(!cryptoAvailable()){
    document.getElementById('app').innerHTML = `<div class="banner setup"><h2>Kan inte starta säkert</h2><p>Registret krypteras och måste därför öppnas via appens webbadress (https), inte som en lokal fil.</p></div>`;
    return;
  }
  renderTopbar();
  if(!loadVault()){
    const hasOld = lsLoadRegistry().length>0;
    showLockScreen('create', hasOld ? 'Registret ska nu skyddas med en PIN-kod. Välj sex siffror — dina befintliga register krypteras med koden.' : null);
    return;
  }
  showLockScreen('unlock');
}
init();

/* ---------- PWA: offline-stöd och beständig lagring ---------- */
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service worker:', e)); });
}
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});
}
</script>
